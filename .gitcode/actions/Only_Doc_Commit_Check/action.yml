name: 'Only_Doc_Commit_Check'
author: 'Ascend'
version: '1.0.0'
description: 检查 PR 是否仅包含文档变更。
inputs:
  pr_id:
    description: PR ID
    required: true
  target_branch:
    description: 目标分支名称
    required: true
  result_msg_path:
    description: 结果消息输出目录路径
    required: false
    default: ""
  step_id:
    description: 步骤ID
    required: false
    default: ""
  remote_url:
    description: 目标仓库的远程 URL
    required: true
    default: ""

runs:
  using: 'node16'
  main: 'dist/main.js'
