name: UT Job

on:
  workflow_call:
    inputs:
      py_version:
        required: false
        type: string
        default: ${{ '3.10' }}
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      CP_DOCKER_IMG:
        required: true
        type: string
      pytorch_branch:
        required: true
        type: string
      TARGET_BRANCH:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.base.ref }}
      TEST_RANK:
        required: false
        type: string
      TEST_WORLD_SIZE:
        required: false
        type: string

jobs:
  UT:
    name: UT
    select: selected_by_default
    runs-on: [ self-hosted, npu=0 ]
    # runs-on: [ self-hosted, npuType=910b2, npuNum=1 ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}
    env:
      TEST_RANK: ${{ inputs.TEST_RANK }}
      TEST_WORLD_SIZE: ${{ inputs.TEST_WORLD_SIZE }}
    steps:
      - name: print env
        run: |
          echo "pytorch_branch=${{ inputs.pytorch_branch }}"
          echo "py_version=${{ inputs.py_version }}"
          echo "pr_id=${{ inputs.pr_id }}"
          echo "CP_DOCKER_IMG=swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}"
          echo "REMOTE_URL=${{ inputs.REMOTE_URL }}"
          echo "inputs.TARGET_BRANCH=${{ inputs.TARGET_BRANCH }}"
          echo "TEST_RANK=${{ env.TEST_RANK }}"
          echo "TEST_WORLD_SIZE=${{ env.TEST_WORLD_SIZE }}"
        
      - name: check branch support
        id: check_support
        run: |
          PYTORCH_BRANCH="${{ inputs.pytorch_branch }}"
          TARGET_BRANCH="${{ inputs.TARGET_BRANCH }}"
          echo "TARGET_BRANCH=${TARGET_BRANCH}"
          echo "PYTORCH_BRANCH=${PYTORCH_BRANCH}"
          if [ "${TARGET_BRANCH}" = "master" ]; then
            echo "master branch, build all versions"
            echo "need_ut=yes" >> "$ATOMGIT_OUTPUT"
            echo "pytorch_build_branch=${PYTORCH_BRANCH}" >> "$ATOMGIT_OUTPUT"
            exit 0
          fi
          support_730="v2.6.0 v2.7.1 v2.8.0 v2.9.0"
          support_2600="v2.7.1 v2.8.0 v2.9.0 v2.10.0"
          support_2610="v2.7.1 v2.9.0 v2.10.0 v2.11.0 v2.12.0"
          suffix="${TARGET_BRANCH//./}"
          list="support_${suffix}"
          if [[ ! " ${!list} " =~ " ${PYTORCH_BRANCH} " ]]; then
            echo "${TARGET_BRANCH} no need execute ${PYTORCH_BRANCH} build"
            echo "need_ut=no" >> "$ATOMGIT_OUTPUT"
          else
            echo "${TARGET_BRANCH} need execute ${PYTORCH_BRANCH} build"
            echo "need_ut=yes" >> "$ATOMGIT_OUTPUT"
            echo "pytorch_build_branch=${PYTORCH_BRANCH}-${TARGET_BRANCH}" >> "$ATOMGIT_OUTPUT"
          fi

      - name: checkout pytorch
        if: ${{ steps.check_support.outputs.need_ut == 'yes' && inputs.pytorch_branch == 'master' }}
        uses: checkout
        with:
          repository: https://gitcode.com/Ascend/pytorch.git
          ref: refs/heads/master
          path: pytorch
          fetch-depth: 1
      - name: install torch
        if: ${{ steps.check_support.outputs.need_ut == 'yes' && inputs.pytorch_branch == 'master' }}
        run: |
          torch_version=$(cat pytorch/requirements.txt | grep torch== | cut -c 8-25)
          nightly_date=${torch_version:10:8}
          echo "torch_version=${torch_version}"
          echo "nightly_date=${nightly_date}"

          if [ ${#nightly_date} -ne 8 ]; then
            ver=${torch_version:0:6}
            url_base="https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/torch/v${ver}"
          else
            ver=${torch_version}
            url_base="https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/torch/master/${nightly_date}"
          fi

          torch_url="${url_base}/torch-${ver}%2Bcpu-cp310-cp310-manylinux_2_28_aarch64.whl"
          echo "torch_url=${torch_url}"
          pip"${{ inputs.py_version }}" install $torch_url
      - name: download op-plugin artifact
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        uses: download-artifact
        with:
          name: op-plugin-${{ inputs.pytorch_branch }}-arm
          path: ./

      - name: Verify artifact
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        run: |
          ls -al
          pip"${{ inputs.py_version }}" install torch_npu*.whl
        working-directory: ./

      - name: checkout op-plugin
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        uses: checkout
        with:
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
          fetch-depth: 1

      - name: download modify_files.txt artifact
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        uses: download-artifact
        with:
          name: modify_files.txt
          path: ./

      - name: UT_op-plugin
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        run: |
          pwd
          ls -al
          pip"${{ inputs.py_version }}" list
          source /etc/profile
          export PTA_UT_EXEC_TIMEOUT=4800
          source /usr/local/Ascend/cann/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          python"${{ inputs.py_version }}" ci/access_control_test.py --rank=${{ env.TEST_RANK }} --world_size=${{ env.TEST_WORLD_SIZE }}

      - name: checkout pytorch
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        uses: checkout
        with:
          repository: https://gitcode.com/Ascend/pytorch.git
          ref: refs/heads/${{ inputs.pytorch_branch }}
          path: pytorch
          submodules: true

      - name: UT_pytorch
        if: ${{ steps.check_support.outputs.need_ut == 'yes' }}
        run: |
          ls -al
          python"${{ inputs.py_version }}" pytorch/ci/access_control_test.py --rank=${{ env.TEST_RANK }} --world_size=${{ env.TEST_WORLD_SIZE }}
