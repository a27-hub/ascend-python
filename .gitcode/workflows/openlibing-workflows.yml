  # ==================== 迁移自 sec-option-scan.yml ====================
  build-and-scan:
    name: 构建产物安全编译选项扫描
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout
        uses: checkout
        with:
          ref: 7.3.0
          path: .

      # 构建受控样例产物：一个按安全基线编译（合规），一个不带安全选项（不合规）
      - name: build sample artifact
        id: build
        run: |
          echo "===== 构建样例产物 ====="
          mkdir -p artifacts && cd artifacts
          printf '#include <stdio.h>\n#include <string.h>\nvoid copy_it(char *dst, const char *src){strcpy(dst, src);}\nint main(int argc, char **argv){char buf[64];copy_it(buf, argc>1?argv[1]:"hello");printf("%%s\\n", buf);return 0;}\n' > sample.c
          gcc -fPIE -pie -fstack-protector-strong -D_FORTIFY_SOURCE=2 -O2 -fvisibility=hidden -fstack-clash-protection -frecord-gcc-switches -Wl,-z,relro,-z,now -o secure_app sample.c
          gcc -no-pie -fno-stack-protector -O0 -o insecure_app sample.c
          tar czf sec-sample-artifact.tar.gz secure_app insecure_app
          ls -la
          echo "artifact-path=$(pwd)/sec-sample-artifact.tar.gz" >> "$ATOMGIT_OUTPUT"

      - name: security-compilation-options-scan
        uses: openlibing/security-compilation-options-action@723583dde3102e34bf7dda1bb321979155a9ed1f
        with:
          artifact-path: ${{ steps.build.outputs.artifact-path }}
