name: openlibing-workflows

# 本文件由以下 4 个工作流迁移整合而来（原触发方式统一变更为 pull_request_comment）：
#   - openlibing-actions-runtime-acceptance.yml
#   - code-metrics-scan.yml
#   - sca-pr-event-acceptance.yml
#   - sec-option-scan.yml
on:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]

permissions:
  repository: read
  id-token: write

jobs:
  # ==================== 迁移自 openlibing-actions-runtime-acceptance.yml ====================
  pre-commit:
    name: pre-commit action
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout current project
        uses: checkout
        with:
          ref: 7.3.0
          path: .
      - name: Prepare pre-commit fixture
        shell: bash
        run: |
          mkdir -p .openlibing-acceptance
          printf 'workflow acceptance fixture\n' > .openlibing-acceptance/pre-commit-fixture.txt
          cat > .pre-commit-config.yaml <<'EOF'
          repos:
            - repo: https://gitcode.com/gh_mirrors/pr/pre-commit-hooks
              rev: v4.6.0
              hooks:
                - id: trailing-whitespace
                - id: end-of-file-fixer
          EOF
      - name: Setup Python
        uses: setup-python
        with:
          python-version: "3.14"
      - name: Run pre-commit-action
        continue-on-error: true
        uses: openlibing/pre-commit-action@v1.0.0
        with:
          extra_args: --files=.openlibing-acceptance/pre-commit-fixture.txt

  security-compilation-options:
    name: security compilation options action
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout current project
        uses: checkout
        with:
          ref: 7.3.0
          path: .
      - name: Prepare action input fixture
        id: prepare-security-input
        shell: bash
        run: |
          mkdir -p .openlibing-acceptance
          printf 'workflow action acceptance fixture\n' > .openlibing-acceptance/README.txt
          tar czf .openlibing-acceptance/security-artifact.tar.gz .openlibing-acceptance/README.txt
          echo "artifact-path=$(pwd)/.openlibing-acceptance/security-artifact.tar.gz" >> "$ATOMGIT_OUTPUT"
      - name: Run security-compilation-options-action
        continue-on-error: true
        uses: openlibing/security-compilation-options-action@v1.0.0
        with:
          artifact-path: ${{ steps.prepare-security-input.outputs.artifact-path }}

  metadata-collect:
    name: metadata collect action
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout current project
        uses: checkout
        with:
          ref: 7.3.0
          path: .
      - name: Prepare pytest fixture
        shell: bash
        run: |
          mkdir -p .openlibing-acceptance/tests
          printf 'def test_workflow_acceptance():\n    assert True\n' > .openlibing-acceptance/tests/test_workflow_acceptance.py
      - name: Run metadata-collect
        continue-on-error: true
        uses: openlibing/test-action/metadata-collect@v1.0.0
        with:
          testcase-path: .openlibing-acceptance/tests
          metadata-output-path: metadata_acceptance.xml

  upload-reports:
    name: upload reports action
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout current project
        uses: checkout
        with:
          ref: 7.3.0
          path: .
      - name: Prepare report fixtures
        shell: bash
        run: |
          mkdir -p .openlibing-acceptance
          printf '<testsuite tests="1"><testcase name="workflow-acceptance"/></testsuite>\n' > .openlibing-acceptance/results.xml
          printf '<metadata><testCases><testCase><name>workflow-acceptance</name></testCase></testCases></metadata>\n' > .openlibing-acceptance/metadata.xml
      - name: Run upload-reports
        continue-on-error: true
        uses: openlibing/test-action/upload-reports@v1.0.0
        with:
          files: .openlibing-acceptance/metadata.xml .openlibing-acceptance/results.xml
          label: workflow-acceptance

