name: UT Job

on:
  workflow_call:
    inputs:
      py_version:
        required: false
        type: string
        default: "3.10"
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      CP_DOCKER_IMG:
        required: true
        type: string
      pytorch_branch:
        required: true
        type: string
      runs_on_arch:
        required: false
        type: string
        default: "x64"
      runs_on_os:
        required: false
        type: string
        default: "euler"
      runs_on_spec:
        required: false
        type: string
        default: "large"
      TEST_RANK:
        required: false
        type: string
      TEST_WORLD_SIZE:
        required: false
        type: string

jobs:
  JOB_UT:
    name: JOB_UT
    select: selected_by_default
    # runs-on: [ self-hosted, arch=arm64, os=euler ]
    # runs-on: [ self-hosted,"${{ inputs.runs_on_arch }}", "${{ inputs.runs_on_spec }}" ]
    runs-on: [ self-hosted, npu=1 ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}
      options: --user root
    env:
      TEST_RANK: ${{ inputs.TEST_RANK }}
      TEST_WORLD_SIZE: ${{ inputs.TEST_WORLD_SIZE }}
    steps:
      - name: print env
        run: |
          env
      - name: Prepare UT workspace
        run: |
          rm -rf *
      - name: oidc-auth
        uses: huaweicloud-oidc-auth
        with:
          audience: pta_pr_obs_for_pytorch
          region: cn-north-4
          agency_urn: iam::0d336831568090260fd5c01450729240:agency:pta_obs_pr_trust
          provider_urn: iam::0d336831568090260fd5c01450729240:oidcProvider:pta_obs_pr
      - name: Resolve build object key
        id: resolve-build-key
        run: |
          set -e
          case "$(uname -m)" in
            x86_64) artifact_arch="x86_64" ;;
            aarch64) artifact_arch="aarch64" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac

          if [ "${{ atomgit.event.pull_request.base.ref }}" = "master" ]; then
            artifact_name="torch_npu_${{ inputs.pytorch_branch }}_${artifact_arch}.tar.gz"
          else
            artifact_name="torch_npu_${{ inputs.pytorch_branch }}-${{ atomgit.event.pull_request.base.ref }}_${artifact_arch}.tar.gz"
          fi

          artifact_key="op-plugin/PR/${{ inputs.pr_id }}/${artifact_name}"
          echo "Resolved OBS object key: ${artifact_key}"
          echo "obs-key=${artifact_key}" >> "$ATOMGIT_OUTPUT"
      - name: Download build output from OBS
        uses: obs-download
        with:
          endpoint: "obs.cn-north-4.myhuaweicloud.com"
          bucket: "pta-pr"
          key: ${{ steps.resolve-build-key.outputs.obs-key }}
          path: obs-output/${{ inputs.pr_id }}
      - name: UT
        run: |
          # .ci/ 仅存在于默认分支，需先拉取
          git clone -b ${{ atomgit.event.repository.default_branch }} ${{ inputs.REMOTE_URL }} cie
          bash cie/.ci/common/merge.sh ${{ atomgit.event.pull_request.base.ref }} ${{ inputs.REMOTE_URL }} ${{ inputs.pr_id }} ${ATOMGIT_WORKSPACE}
          pwd
          cd ./CODE
          git diff-tree -r --name-only --no-commit-id origin/${{ atomgit.event.pull_request.base.ref }} HEAD > ../modify_files.txt
          cat ../modify_files.txt
          cd -
          # 将 OBS 下载的构建产物拷回工作目录供 UT 脚本使用
          cp -rf obs-output/${{ inputs.pr_id }}/* ./
          bash cie/.ci/UT/op-plugin_ut_general.sh ${{ inputs.pytorch_branch }} 3.10 ${{ inputs.pr_id }} ${ATOMGIT_WORKSPACE} ${{ atomgit.event.pull_request.base.ref }}
          echo "pytorch_branch: ${{ inputs.pytorch_branch }}"
          echo "py_version: 3.10"
          echo "pr_id: ${{ env.pr_id }}"
          echo "atomgit.event.pull_request.base.ref: ${{ atomgit.event.pull_request.base.ref }}"


