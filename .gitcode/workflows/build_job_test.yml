name: Build Job

on:
  workflow_call:
    inputs:
      py_version:
        required: false
        type: string
        default: "3.10"
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}
      pr_id:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.number }}
      CP_DOCKER_IMG:
        required: true
        type: string
      pytorch_branch:
        required: true
        type: string
      runs_on_arch:
        required: false
        type: string
        default: "x64"
      runs_on_os:
        required: false
        type: string
        default: "openeuler"
      runs_on_spec:
        required: false
        type: string
        default: "large"
      TARGET_BRANCH:
        required: false
        type: string
        default: ${{ atomgit.event.pull_request.base.ref }}

jobs:
  JOB_compile:
    name: JOB_compile
    select: selected_by_default
    # runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
    # runs-on:  [ self-hosted, "${{ inputs.runs_on_arch }}", "${{ inputs.runs_on_os }}" ]
    # runs-on: [ self-hosted, "${{ inputs.runs_on_os }}", "${{ inputs.runs_on_arch }}", "${{ inputs.runs_on_spec }}" ]
    runs-on: [ self-hosted, x86, cpu=8 ]
    # runs-on: [ dedicate-hosted,"${{ inputs.runs_on_arch }}", "${{ inputs.runs_on_spec }}" ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}
    steps:
      - name: print env
        run: |
          echo "[ self-hosted, "${{ inputs.runs_on_arch }}", "${{ inputs.runs_on_os }}" ]"
          echo "pytorch_branch=${{ inputs.pytorch_branch }}"
          echo "py_version=${{ inputs.py_version }}"
          echo "pr_id=${{ inputs.pr_id }}"
          echo "CP_DOCKER_IMG=swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}"
          echo "REMOTE_URL=${{ inputs.REMOTE_URL }}"
          echo "inputs.TARGET_BRANCH=${{ inputs.TARGET_BRANCH }}"

      # - name: compile
      #   run: |
      #     rm -rf *
      #     git config --global http.postBuffer 524288000
      #     git config --global http.lowSpeedLimit 5000
      #     git config --global http.lowSpeedTime 300
      #     # .ci/ 仅存在于默认分支，需先拉取
      #     git clone -b ${{ atomgit.event.repository.default_branch }} ${{ inputs.REMOTE_URL }} cie
      #     bash cie/.ci/common/merge.sh ${{ atomgit.event.pull_request.base.ref }} ${{ inputs.REMOTE_URL }} ${{ inputs.pr_id }} ${ATOMGIT_WORKSPACE}
      #     cd ./CODE
      #     git diff-tree -r --name-only --no-commit-id origin/${{ atomgit.event.pull_request.base.ref }} HEAD > ../modify_files.txt
      #     cat ../modify_files.txt
      #     cd -
      #     source cie/.ci/common/ccache_env.sh
      #     bash cie/.ci/build/op-plugin_build.sh ${{ inputs.pytorch_branch }} 3.10 ${{ inputs.pr_id }} ${ATOMGIT_WORKSPACE} ${{ atomgit.event.pull_request.base.ref }}
      - name: shell-test
        run: |
          pwd
          test_file=oidc-upload-test.bin
          head -c 1048576 /dev/urandom > "${test_file}"
          test "$(stat -c '%s' "${test_file}")" -eq 1048576
          sha256sum "${test_file}"
      # - name: Debug OIDC Token Claims
      #   run: |
      #     URL="${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}"
      #     if echo "$URL" | grep -q '?'; then
      #       FULL_URL="${URL}&audience=pta_pr_obs_for_pytorch"
      #     else
      #       FULL_URL="${URL}?audience=pta_pr_obs_for_pytorch"
      #     fi
      #     RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
      #       -H "Authorization: Bearer ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}" \
      #       "$FULL_URL")
      #     echo "$RESPONSE"
      #     JWT=$(echo "$RESPONSE" | sed -n 's/.*"value":[ ]*"\([^"]*\)".*/\1/p')
      #     echo "JWT length: ${#JWT}"
      #     PAYLOAD=$(echo "$JWT" | cut -d'.' -f2 | tr '_-' '/+')
      #     case $((${#PAYLOAD} % 4)) in
      #       2) PAYLOAD="${PAYLOAD}==";;
      #       3) PAYLOAD="${PAYLOAD}=";;
      #     esac
      #     echo "$PAYLOAD" | base64 -d 2>/dev/null || echo "base64 decode failed"
      - name: oidc-auth
        uses: huaweicloud-oidc-auth
        with:
          audience: pta_pr_obs_for_pytorch
          region: cn-north-4
          agency_urn: iam::0d336831568090260fd5c01450729240:agency:pta_obs_pr_trust
          provider_urn: iam::0d336831568090260fd5c01450729240:oidcProvider:pta_obs_pr
      - name: Debug OIDC credential handoff
        run: |
          report_credential() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s: present (length=%s)\n' "$name" "${#value}"
            else
              printf '%s: MISSING\n' "$name"
            fi
          }

          # Print only presence and length; never print credential values.
          report_credential HUAWEICLOUD_OIDC_AK "${HUAWEICLOUD_OIDC_AK:-}"
          report_credential HUAWEICLOUD_OIDC_SK "${HUAWEICLOUD_OIDC_SK:-}"
          report_credential HUAWEICLOUD_SECURITY_TOKEN "${HUAWEICLOUD_SECURITY_TOKEN:-}"
          report_credential HUAWEICLOUD_SDK_AK "${HUAWEICLOUD_SDK_AK:-}"
          report_credential HUAWEICLOUD_SDK_SK "${HUAWEICLOUD_SDK_SK:-}"
          report_credential HUAWEICLOUD_SDK_SECURITY_TOKEN "${HUAWEICLOUD_SDK_SECURITY_TOKEN:-}"
          report_credential OBS_AK "${OBS_AK:-}"
          report_credential OBS_SK "${OBS_SK:-}"

          if [ -n "${HUAWEICLOUD_OIDC_AK:-}" ] && \
             [ -n "${HUAWEICLOUD_OIDC_SK:-}" ] && \
             [ -n "${HUAWEICLOUD_SECURITY_TOKEN:-}" ]; then
            echo "OIDC credential handoff: all expected variables are present"
          else
            echo "::warning::OIDC credential handoff: one or more expected variables are missing"
          fi
      - name: Upload build outputs to OBS
        uses: obs-upload
        with:
          endpoint: "obs.cn-north-4.myhuaweicloud.com"
          bucket: "pta-pr"
          artifact-path: |
            *.tar.gz*
            oidc-upload-test.bin
          object-prefix: "op-plugin/PR/${{ inputs.pr_id }}/"
