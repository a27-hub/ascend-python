name: Nightly-pipeline_op-plugin

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  # 定时触发：每天凌晨 2:00 (UTC+8)
  schedule:
    - cron: "0 18 * * *"

  # 测试阶段：PR 触发
  pull_request:
    types: [open, update, reopen]
    branches: [ 'master' ]

  # 测试阶段：Push 触发
  push:
    branches: [ 'master' ]

env:
  repo: ${{ atomgit.event.repository.name }}
  org_name: "ComputingActionTest"
  img_master_arm: "pytorch_master_a2_aarch64_builder:20260704"
  # UT 分片总数,需与 stage_2 中 UT job 的数量保持一致
  TEST_WORLD_SIZE: "6"

stages:
  stage_1:
    name: Build
    select: selected_by_default
    jobs:
      Build_master:
        name: Build ARM 
        uses: .gitcode/workflows/nightly_build_job.yml
        with:
          pytorch_branch: "master"
          CP_DOCKER_IMG: ${{ env.img_master_arm }}

  stage_2:
    name: Unit Test (run full op-plugin UT suite)
    select: selected_by_default
    jobs:
      ut_arm_part_1:
        name: Unit Test ARM - Part 1
        uses: .gitcode/workflows/nightly_ut_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          TEST_RANK: "1"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_arm_part_2:
        name: Unit Test ARM - Part 2
        uses: .gitcode/workflows/nightly_ut_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          TEST_RANK: "2"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_arm_part_3:
        name: Unit Test ARM - Part 3
        uses: .gitcode/workflows/nightly_ut_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          TEST_RANK: "3"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_arm_part_4:
        name: Unit Test ARM - Part 4
        uses: .gitcode/workflows/nightly_ut_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          TEST_RANK: "4"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_arm_part_5:
        name: Unit Test ARM - Part 5
        uses: .gitcode/workflows/nightly_ut_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          TEST_RANK: "5"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_arm_part_6:
        name: Unit Test ARM - Part 6
        uses: .gitcode/workflows/nightly_ut_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          TEST_RANK: "6"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}