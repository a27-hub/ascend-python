name: Nightly-pipeline_op-plugin

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  # 定时触发：每天凌晨 2:00 (UTC+8)
  schedule:
    - cron: "0 18 * * *"

  # 测试阶段：PR 触发
  pull_request:
    types: [open, update, reopen]
    branches: [ 'master' ]

  # 测试阶段：Push 触发
  push:
    branches: [ 'master' ]

env:
  repo: ${{ atomgit.event.repository.name }}
  org_name: "ComputingActionTest"
  img_master_arm: "pytorch_master_a2_aarch64_builder:20260704"
  # 编译使用的 PyTorch 分支
  pytorch_branch: "master"
  # UT 分片总数,需与 unit_test 阶段中 UT job 的数量保持一致
  TEST_WORLD_SIZE: "3"

stages:
  build:
    name: Build
    select: selected_by_default
    jobs:
      Build_master:
        name: Build ARM 
        uses: .gitcode/workflows/nightly_build_job.yml
        with:
          pytorch_branch: ${{ env.pytorch_branch }}
          CP_DOCKER_IMG: ${{ env.img_master_arm }}

  collect:
    name: Collect Test Cases
    select: selected_by_default
    jobs:
      collect_cases:
        name: Collect Cases
        uses: .gitcode/workflows/nightly_collect_testcases.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          pytorch_branch: ${{ env.pytorch_branch }}
          REGULAR_NPU_SHARDS: ${{ env.TEST_WORLD_SIZE }}

  # 新版 UT stage: 消费 collect 阶段产出的 collected-cases artifact,
  # 由 run_npu_test_shard.py 按分片执行
  # (常规分片并行/单卡轮转, 分布式分片串行独占全卡)
  unit_test:
    name: Unit Test (run sharded cases from collect stage)
    select: selected_by_default
    jobs:
      ut_regular_1:
        name: op-plugin UT regular 1/3
        uses: .gitcode/workflows/nightly_ut_exec_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          SHARD_TYPE: regular
          TEST_RANK: "1"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_regular_2:
        name: op-plugin UT regular 2/3
        uses: .gitcode/workflows/nightly_ut_exec_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          SHARD_TYPE: regular
          TEST_RANK: "2"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_regular_3:
        name: op-plugin UT regular 3/3
        uses: .gitcode/workflows/nightly_ut_exec_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          SHARD_TYPE: regular
          TEST_RANK: "3"
          TEST_WORLD_SIZE: ${{ env.TEST_WORLD_SIZE }}

      ut_distributed:
        name: op-plugin UT distributed
        uses: .gitcode/workflows/nightly_ut_exec_job.yml
        with:
          CP_DOCKER_IMG: ${{ env.img_master_arm }}
          SHARD_TYPE: distributed
          TEST_RANK: "1"
          TEST_WORLD_SIZE: "1"

