      Build_master_ARM:
        name: Build_master_ARM
        if : ${{ jobs.Detect_file_changes.outputs.build_skip == 'no' }}
        uses: .gitcode/workflows/build_job.yml
        secrets:
          OBS_AK: ${{ secrets.OBS_AK }}
