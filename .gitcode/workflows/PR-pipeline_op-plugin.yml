name: PR-pipeline_op-plugin

on:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
inputs:
  repo:
    type: string
    description: "仓库名称"
    default: ${{ atomgit.event.repository.name }}
  REMOTE_URL:
    type: string
    description: "远程仓库URL"
    default: ${{ env.ATOMGIT_REPOSITORY_URL }}
  org_name:
    type: string
    description: "组织名称"
    default: "wangwq129"
  pr_id:
    type: string
    description: "PR ID"
    default: ${{ atomgit.event.pull_request.number }}
  workspace:
    type: string
    description: "工作目录"
    default: ${{ env.ATOMGIT_WORKSPACE }}

