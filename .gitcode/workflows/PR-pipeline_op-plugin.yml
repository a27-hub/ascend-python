name: PR-pipeline_op-plugin

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ 'master', '26.1.0', '26.0.0', '7.3.0' ]
    comments: [ '^(?:\/)?compile*' ]

env:
  repo: ${{ atomgit.event.repository.name }}
  pr_id: ${{ atomgit.event.pull_request.number }}
  org_name: "Ascend"
  img_master_arm: "pytorch_master_a2_aarch64_builder:20260704"
  img_2_7_1_arm: "pytorch_2.7.1_a2_aarch64_builder:20260704"
  img_2_9_0_arm: "pytorch_2.9.0_a2_aarch64_builder:20260704"
  img_2_10_0_arm: "pytorch_2.10.0_a2_aarch64_builder:20260704"
  img_2_11_0_arm: "pytorch_2.11.0_a2_aarch64_builder:20260704"
  img_2_12_0_arm: "pytorch_2.12.0_a2_aarch64_builder:20260704"
  img_2_13_0_arm: "pytorch_2.13.0_a2_aarch64_builder:20260709"
  img_master_x86: "pytorch_master_a1_x86_64_builder:20260704"
  img_2_7_1_x86: "pytorch_2.7.1_a1_x86_64_builder:20260704"
  img_2_9_0_x86: "pytorch_2.9.0_a1_x86_64_builder:20260704"
  img_2_10_0_x86: "pytorch_2.10.0_a1_x86_64_builder:20260704"
  img_2_11_0_x86: "pytorch_2.11.0_a1_x86_64_builder:20260704"
  img_2_12_0_x86: "pytorch_2.12.0_a1_x86_64_builder:20260704" 
  img_2_13_0_x86: "pytorch_2.13.0_a1_x86_64_builder:20260709"

stages:
  stage_1:
    name: CodeCheck
    select: selected_by_default
    jobs:
      SCA:
        name: SCA
        runs-on: [ dedicate-hosted, x64, 2xlarge ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Run SCA PR Scan
            uses: sca-pr-scan
            with:
              scan-access-key: ${{ secrets.SCAN_ACCESS_KEY }}
              scan-secret-key: ${{ secrets.SCAN_SECRET_KEY }}
              pr-id: ${{ atomgit.event.pull_request.number }}
              repository-name: ${{ atomgit.repository }}
              project-name: FrameworkPTAdapter

      Antipoison:
        name: Antipoison
        runs-on: [ dedicate-hosted, x64, 2xlarge ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: Antipoison
            run: |
              git config --global http.postBuffer 524288000
              git config --global http.lowSpeedLimit 5000
              git config --global http.lowSpeedTime 300
              git clone -b ${{ atomgit.event.repository.default_branch }} ${{ inputs.REMOTE_URL }} cie
              pip3.8 install --trusted-host https://repo.huaweicloud.com -i https://repo.huaweicloud.com/repository/pypi/simple requests
              wget -q https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/tools/ApiGateway-python-sdk-2.0.7.zip --no-check-certificate
              unzip -q ApiGateway-python-sdk-2.0.7.zip
              cp -rf ApiGateway-python-sdk-2.0.7/apig_sdk cie/.gitcode/workflows/scripts/
              python3.8 cie/.gitcode/workflows/scripts/anti_poison.py --created_appId ${{ secrets.ANTIPOISON_CREATED_APPID }} --created_secretKey ${{ secrets.ANTIPOISON_CREATED_SECRETKEY }} --result_appId ${{ secrets.ANTIPOISON_RESULT_APPID }} --result_secretKey ${{ secrets.ANTIPOISON_RESULT_SECRETKEY }} --org_name ${org_name} --pr_id ${pr_id} --repo ${repo}  

      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        runs-on: [ dedicate-hosted, x64, 2xlarge ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
          - name: setup-python310
            run: |
              PYTHON310_BIN=$(dirname "$(which python3.10)")
              ln -sf "$(which python3.10)" "$PYTHON310_BIN/python"
              echo "$PYTHON310_BIN" >> "$ATOMGIT_PATH"
              python --version
          - name: install gitleaks
            run: |
              cd ${ATOMGIT_WORKSPACE}
              wget --no-host-directories -c --no-check-certificate https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta-codecheck/gitleaks
              chmod +x gitleaks
              cd -
          - name: pre-commit
            uses: openlibing-pre-commit-action

      Detect_file_changes:
        name: Detect_file_changes
        runs-on: [ dedicate-hosted, x64, 2xlarge ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        outputs:
          build_skip: ${{ steps.set-skip.outputs.build_skip }}
        steps:
          - name: checkout
            uses: checkout
            with:
              ref: refs/merge-requests/${{ env.pr_id }}/merge
              fetch-depth: 0
          - name: Only_doc_commit
            id: filter
            uses: paths-changes-filter
            with:
              event-name: 'pull_request_target'
              base: ${{ atomgit.event.pull_request.base.ref }}
              repo: ${{ atomgit.repository }}
              number: ${{ env.pr_id }}
              token: ${{ secrets.GITCODE_TOKEN }}
              api-base-url: 'https://test.gitcode.net'
              list-files: json
              filters: |
                non-doc:
                  - '!**.md'
                  - '!**.rst'
                  - '!**.log'
                  - '!**.png'
                  - '!**.jpg'
                  - '!**.doc'
                  - '!**.eddx'
                  - '!**.svg'
          - name: set build skip flag
            id: set-skip
            run: |
              if [ "${{ steps.filter.outputs.non-doc }}" = "true" ]; then
                echo "build_skip=no" >> "$ATOMGIT_OUTPUT"
              else
                echo "build_skip=yes" >> "$ATOMGIT_OUTPUT"
              fi
          # - name: Only Doc Commit Check
          #   id: only-doc-check
          #   uses: WWQ129/.gitcode/actions/Only_Doc_Commit_Check@main
          #   with:
          #     pr_id: ${{ env.pr_id }}
          #     target_branch: ${{ atomgit.event.pull_request.base.ref }}
          #     remote_url: ${{ env.ATOMGIT_REPOSITORY_URL }}
          # - name: set build skip flag
          #   id: set-skip
          #   run: |
          #     BUILD_SKIP=${{ steps.only-doc-check.outputs.is_only_doc }}
          #     echo "build_skip=${BUILD_SKIP}" >> "$ATOMGIT_OUTPUT"
          #     echo "Only Doc Commit Check result: ${BUILD_SKIP}"


  stage_2:
    name: Build
    select: selected_by_default
    jobs:
      Build_master_x86:
        name: Build_master_x86
        if : ${{ jobs.Detect_file_changes.outputs.build_skip == 'no' }}
        uses: .gitcode/workflows/build_job.yml
        secrets:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
        with:
          pytorch_branch: "master"
          CP_DOCKER_IMG: ${{ env.img_master_x86 }}
          runs_on_arch: "x64"
          runs_on_spec: "2xlarge"

      Build_v2_7_1_x86:
        name: Build_v2_7_1_x86
        if : ${{ jobs.Detect_file_changes.outputs.build_skip == 'no' }}
        uses: .gitcode/workflows/build_job.yml
