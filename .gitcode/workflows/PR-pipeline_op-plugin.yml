name: PR-pipeline_op-plugin

on:
  workflow_dispatch:
  push:
    branches: [ "7.3.0" ]
    paths: [ ".gitcode/workflows/PR-pipeline_op-plugin.yml" ]

inputs:
  repo:
    type: string
    description: "仓库名称"
    default: "${test_REPOSITORY_NAME}"
  owner:
    type: string
    description: "仓库所有者"
    default: "Ascend"
  TARGET_BRANCH:
    type: string
    description: "目标分支"
    default: "${test_TARGET_BRANCH}"
  REMOTE_URL:
    type: string
    description: "远程仓库URL"
    default: "${test_REPO_URL}"
  pr_id:
    type: string
    description: "PR ID"
    default: "${MERGE_ID}"
  py_version:
    type: string
    description: "Python版本"
    default: "3.10"
  workspace:
    type: string
    description: "工作目录"
    default: "/workspace"
  CP_pipeline_run_id:
    type: string
    description: "流水线运行ID"
    default: "${PIPELINE_RUN_ID}"
  CP_repo_url:
    type: string
    description: "自定义仓库URL"
    default: "${test_REPO_URL}"
  CP_merge_id:
    type: string
    description: "自定义合并ID"
    default: "${MERGE_ID}"
  CP_target_branch:
    type: string
    description: "自定义目标分支"
    default: "${test_TARGET_BRANCH}"
  img_2_6_0:
    type: string
    description: "PyTorch 2.6.0 ARM构建镜像"
    default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_2.6.0_a2_aarch64_builder:20260418"
  img_2_7_1:
    type: string
    description: "PyTorch 2.7.1 ARM构建镜像"
    default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_2.7.1_a2_aarch64_builder:20260518"
  img_2_9_0:
    type: string
    description: "PyTorch 2.9.0 ARM构建镜像"
    default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_2.9.0_a2_aarch64_builder:20260518"
  img_2_10_0:
    type: string
    description: "PyTorch 2.10.0 ARM构建镜像"
    default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_2.10.0_a2_aarch64_builder:20260518"
  img_2_11_0:
    type: string
    description: "PyTorch 2.11.0 ARM构建镜像"
    default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_2.11.0_a2_aarch64_builder:20260518"
  img_master:
    type: string
    description: "PyTorch master ARM构建镜像"
    default: "swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/pytorch_master_a2_aarch64_builder:20260518"

stages:
  stage_1:
    name: stage_1
    select: selected_by_default
    jobs:
      CodeCheck:
        name: CodeCheck
        runs-on: [ self-hosted, arch=x64, os=euler ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: hello action
            run: |
              echo "hello action"
          - name: Login to CodeArts
            uses: codearts-login
            with:
              region: cn-north-4
              name: Ascend_Pytorch_CI
              password: ${{ secrets.IAM_USER_PASSWORD }}
              domain-name: hwstaff_jsz_gjl
          # - name: check测试执行
          #   uses: codecheck_gitcode_v2
          #   with:
          #     project_id: a9b188a62f334fc0963bcfb523426d17
          #     task_name: wwq-op-plugin-test
          #     branch: 7.3.0


      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        runs-on: [ self-hosted, arch=x64, os=euler ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: checkout
            uses: checkout
          - name: setup-python
            uses: setup-python
          - name: setup-python310
            uses: official_shell_plugin
            with:
              OFFICIAL_SHELL_SCRIPT_INPUT: |-
                  ln -sf /usr/local/bin/python3.10 /usr/bin/python
                  python --version
          - name: pre-commit
            uses: openlibing-pre-commit-action
            with:
              gc_token: ${{ secrets.GC_TOKEN }}
      SCA:
        name: SCA
        runs-on: default
        steps:
          - name: Checkout
            uses: checkout
          - name: Run SCA PR Scan
            id: sca-pr-scan
            uses: sca-pr-scan
            with:
              scan-access-key: ${{ secrets.SCAN_ACCESS_KEY }}
              scan-secret-key: ${{ secrets.SCAN_SECRET_KEY }}
              pr-id: ${{ atomgit.event.pull_request.number }}
              repository-name: ${{ atomgit.repository }}
              platform-domain: ${{ atomgit.api_url }}
              project-name: ${{ atomgit.repository }}
        
      Antipoison:
        name: Antipoison
        runs-on: default
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: Checkout
            uses: checkout
          - name: Antipoison
            uses: official_shell_plugin
            with:
              OFFICIAL_SHELL_SCRIPT_INPUT: |-
                git clone -b master https://codehub.devcloud.cn-north-4.huaweicloud.com/a9b188a62f334fc0963bcfb523426d17/ci_gitcode.git cie
                pip3.8 install --trusted-host https://repo.huaweicloud.com -i https://repo.huaweicloud.com/repository/pypi/simple requests
                wget -q https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/tools/ApiGateway-python-sdk-2.0.7.zip --no-check-certificate
                unzip -q ApiGateway-python-sdk-2.0.7.zip
                cp -rf ApiGateway-python-sdk-2.0.7/apig_sdk cie/codecheck/
                python3.8 cie/codecheck/anti_poison.py --created_appId ${created_appId} --created_secretKey ${created_secretKey} --result_appId ${result_appId} --result_secretKey ${result_secretKey} --org_name ${org_name} --pr_id ${pr_id} --repo ${repo}

