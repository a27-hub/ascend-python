name: PR-pipeline_op-plugin

on:
  pull_request:
    branches:
      - 7.3.0
      - 7.3.0_test
      - master
      - master_test
    types:
      - open
      - update
      - reopen
      - merge
    branches-ignore: []
    paths-ignore: []
    code-update: false
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]
inputs:
  repo:
    type: string
    description: "仓库名称"
    default: ${{ atomgit.event.repository.name }}
  owner:
    type: string
    description: "仓库所有者"
    default: "wangwq129"
  REMOTE_URL:
    type: string
    description: "远程仓库URL"
    default: ${{ env.ATOMGIT_REPOSITORY_URL }}
  org_name:
    type: string
    description: "组织名称"
    default: "wangwq129"
  pr_id:
    type: string
    description: "PR ID"
    default: ${{ env.MERGE_ID }}
  workspace:
    type: string
    description: "工作目录"
    default: ${{ env.ATOMGIT_WORKSPACE }}

env:
  BUILD_SKIP: "yes"
  img_master_arm: pytorch_master_a2_aarch64_builder:20260518
  img_2_7_1_arm: pytorch_2.7.1_a2_aarch64_builder:20260518
  img_2_9_0_arm: pytorch_2.9.0_a2_aarch64_builder:20260518
  img_2_10_0_arm: pytorch_2.10.0_a2_aarch64_builder:20260518
  img_2_11_0_arm: pytorch_2.11.0_a2_aarch64_builder:20260518
  img_2_12_0_arm: pytorch_2.12.0_a2_aarch64_builder:20260518
  img_master_x86: pytorch_master_a1_x86_64_builder:20260418
  img_2_7_1_x86: pytorch_2.7.1_a1_x86_64_builder:20260418
  img_2_9_0_x86: pytorch_2.9.0_a1_x86_64_builder:20260418
  img_2_10_0_x86: pytorch_2.10.0_a1_x86_64_builder:20260418
  img_2_11_0_x86: pytorch_2.11.0_a1_x86_64_builder:20260418
  img_2_12_0_x86: pytorch_2.12.0_a1_x86_64_builder:20260518

stages:
  stage_1:
    name: stage_1
    select: selected_by_default
    jobs:
      CodeCheck:
        name: CodeCheck
        # runs-on: [ self-hosted, arch=x64, os=euler ]
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          - name: Dump Atomgit context
            env:
              ATOMGIT_CONTEXT: ${{ toJson(atomgit) }}
            run: echo "$ATOMGIT_CONTEXT"
          - name: Dump job context
            env:
              JOB_CONTEXT: ${{ toJson(job) }}
            run: echo "$JOB_CONTEXT"
          - name: Dump steps context
            env:
              STEPS_CONTEXT: ${{ toJson(steps) }}
            run: echo "$STEPS_CONTEXT"
          - name: Dump runner context
            env:
              RUNNER_CONTEXT: ${{ toJson(runner) }}
            run: echo "$RUNNER_CONTEXT"
          - name: Dump strategy context
            env:
              STRATEGY_CONTEXT: ${{ toJson(strategy) }}
            run: echo "$STRATEGY_CONTEXT"
          - name: Dump matrix context
            env:
              MATRIX_CONTEXT: ${{ toJson(matrix) }}
            run: echo "$MATRIX_CONTEXT"
          - name: hello action
            run: |
              echo "print env"
              env
              echo "print env end"
          - name: Login to CodeArts
            uses: codearts-login
            with:
              region: cn-north-4
              name: Ascend_Pytorch_CI
              password: ${{ secrets.IAM_USER_PASSWORD }}
              domain-name: hwstaff_jsz_gjl
          - name: codecheck
            uses: codecheck_gitcode_v2
            with:
              project_id: a9b188a62f334fc0963bcfb523426d17
              task_name: wwq-op-plugin-test
              branch: master

      SCA:
        name: SCA
        # runs-on: [ self-hosted, arch=x64, os=euler ]
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
        steps:
          # - name: checkout
          #   uses: checkout
          - name: checkout
            run: |
              pwd
              rm -rf *
              set -ex
              git config --global user.name wangwq129
              git config --global user.email wangweiqi22@huawei.com
              git clone --depth=1 -b ${TARGET_BRANCH} https://wangwq129:${{secrets.ACCESS_WWQ}}@gitcode.com/wangwq129/op-plugin.git .
          - name: Run SCA PR Scan
            id: sca-pr-scan
            uses: sca-pr-scan
            with:
              scan-access-key: ${{ secrets.SCAN_ACCESS_KEY }}
              scan-secret-key: ${{ secrets.SCAN_SECRET_KEY }}
              pr-id: ${{ atomgit.event.pull_request.number }}
              repository-name: ${{ atomgit.repository }}
              project-name: FrameworkPTAdapter

      Antipoison:
        name: Antipoison
        # runs-on: [ self-hosted, arch=x64, os=euler ]
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          # - name: checkout
          #   uses: checkout
          - name: checkout
            run: |
              pwd
              rm -rf *
              set -ex
              git config --global user.name wangwq129
              git config --global user.email wangweiqi22@huawei.com
              git clone --depth=1 -b ${TARGET_BRANCH} https://wangwq129:${{secrets.ACCESS_WWQ}}@gitcode.com/wangwq129/op-plugin.git .
          - name: Antipoison
            run: |
              git clone -b master https://codehub.devcloud.cn-north-4.huaweicloud.com/a9b188a62f334fc0963bcfb523426d17/ci_gitcode.git cie
              pip3.8 install --trusted-host https://repo.huaweicloud.com -i https://repo.huaweicloud.com/repository/pypi/simple requests
              wget -q https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/tools/ApiGateway-python-sdk-2.0.7.zip --no-check-certificate
              unzip -q ApiGateway-python-sdk-2.0.7.zip
              cp -rf ApiGateway-python-sdk-2.0.7/apig_sdk cie/codecheck/
              python3.8 cie/codecheck/anti_poison.py --created_appId ${{ secrets.ANTIPOISON_CREATED_APPID }} --created_secretKey ${{ secrets.ANTIPOISON_CREATED_SECRETKEY }} --result_appId ${{ secrets.ANTIPOISON_RESULT_APPID }} --result_secretKey ${{ secrets.ANTIPOISON_RESULT_SECRETKEY }} --org_name ${org_name} --pr_id ${pr_id} --repo ${repo}

      CodeCheck_pre_commit:
        name: CodeCheck_pre_commit
        # runs-on: [ self-hosted, arch=x64, os=euler ]
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          # - name: checkout
          #   uses: checkout
          - name: checkout
            run: |
              echo "remote_url= ${{ REMOTE_URL }}"
              pwd
              rm -rf *
              git config --global user.name wangwq129
              git config --global user.email wangweiqi22@huawei.com
              git clone --depth=1 -b ${TARGET_BRANCH} https://wangwq129:${{secrets.ACCESS_WWQ}}@gitcode.com/wangwq129/op-plugin.git .
          - name: setup-python
            uses: setup-python
          - name: setup-python310
            run: |
              ln -sf /usr/local/bin/python3.10 /usr/bin/python
              python --version
              ls -al
          - name: pre-commit
            uses: openlibing-pre-commit-action
            with:
              gc_token: ${{ secrets.GC_TOKEN }}

      Only_doc_commit:
        name: Only_doc_commit
        # runs-on: [ self-hosted, arch=x64, os=euler ]
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
          options: --user root
        steps:
          # - name: checkout
          #   uses: checkout
          - name: checkout
            run: |
              pwd
              echo "remote_url= ${{ REMOTE_URL }}"
              rm -rf *
              git config --global user.name wangwq129
              git config --global user.email wangweiqi22@huawei.com
              git clone --depth=1 -b ${TARGET_BRANCH} https://wangwq129:${{secrets.ACCESS_WWQ}}@gitcode.com/wangwq129/op-plugin.git .
          - name: merge
            run: |
              git fetch origin
              git fetch origin refs/merge-requests/${pr_id}/head:new_${pr_id}
              git checkout new_${pr_id}
              git merge origin/${TARGET_BRANCH}
              ls -al
          - name: setup-node
            uses: setup-node
            with:
              node-version: '16'
              package-manager: 'npm'
              registry-url: 'https://registry.npmmirror.com/'
          - name: actions install
            run: |
              cd .gitcode/actions/Only_Doc_Commit_Check
              npm install @actions/core@^1.10.0
              cd -
          - name: print params
            run: |
              echo "pr_id= ${pr_id}"
              echo "target_branch= ${TARGET_BRANCH}"
              echo "remote_url= ${REMOTE_URL}"
          - name: Only Doc Commit Check
            id: only-doc-check
            uses: ./.gitcode/actions/Only_Doc_Commit_Check
            with:
              pr_id: ${{ env.pr_id }}
              target_branch: ${{ env.TARGET_BRANCH }}
              remote_url: ${{ env.REMOTE_URL }}
          - name: set build skip flag
            run: |
              export BUILD_SKIP=${{ steps.only-doc-check.outputs.is_only_doc }}
              echo "Only Doc Commit Check result: ${{ steps.only-doc-check.outputs.is_only_doc }}"

  stage_2:
    name: stage_2
    select: selected_by_default
    jobs:
      Build_master_ARM:
        name: Build_master_ARM
        if : ${{ env.BUILD_SKIP == 'no' }}
        uses: .gitcode/workflows/build_job.yml
        secrets:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_SK: ${{ secrets.OBS_SK }}
        with:
          pytorch_branch: master
          CP_DOCKER_IMG: ${{ env.img_master_arm }}

      build:
        name: build
        runs-on: [ 'codearts-hosted', 'ubuntu-latest', 'x64', 'large' ]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ env.img_master_arm }}
          options: --user root
        steps:
          - name: print env
            run: |
              env
          - name: build
            run: |
              rm -rf *
              git config --global http.postBuffer 524288000
              git config --global http.lowSpeedLimit 5000
              git config --global http.lowSpeedTime 300
              git clone -b master https://codehub.devcloud.cn-north-4.huaweicloud.com/a9b188a62f334fc0963bcfb523426d17/ci_gitcode.git cie
              bash cie/common/common/merge.sh ${TARGET_BRANCH} ${REMOTE_URL} ${pr_id} ${WORKSPACE}
              cd ./CODE
              git diff-tree -r --name-only --no-commit-id origin/${TARGET_BRANCH} HEAD > ../modify_files.txt
              cat ../modify_files.txt
              cd -
              source cie/common/common/ccache_env.sh
              bash cie/common/build/op-plugin_build.sh ${pytorch_branch} ${py_version} ${pr_id} ${WORKSPACE} ${TARGET_BRANCH}
          - name: Upload to OBS
            uses: obs-upload
            with:
              endpoint: "obs.cn-north-4.myhuaweicloud.com"
              bucket: "pta-pr"
              access-key: "${{ secrets.OBS_AK }}"
              secret-key: "${{ secrets.OBS_SK }}"
              artifact-path: "*.tar.gz*"
              object-prefix: "op-plugin/PR/${{env.pr_id}}/"

