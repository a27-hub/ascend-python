name: Build Job

on:
  workflow_call:
    inputs:
      py_version:
        required: false
        type: string
        default: "3.10"
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}
      pr_id:
        required: false
        type: string
        default: ${{ env.MERGE_ID }}
      CP_DOCKER_IMG:
        required: true
        type: string
      pytorch_branch:
        required: true
        type: string
    secrets:
      OBS_AK:
        required: true
      OBS_SK:
        required: true


jobs:
  JOB_compile:
    name: JOB_compile
    select: selected_by_default
    runs-on: [ self-hosted, arch=x64, os=euler ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}
      # image: swr.cn-north-4.myhuaweicloud.com/pytorch_images_x86/pytorchx86:v_03
      options: --user root
    steps:
      - name: print env
        run: |
          echo "CP_DOCKER_IMG=${{ inputs.CP_DOCKER_IMG }}"
      - name: compile
        run: |
          rm -rf *
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 5000
          git config --global http.lowSpeedTime 300
          git clone -b master https://codehub.devcloud.cn-north-4.huaweicloud.com/a9b188a62f334fc0963bcfb523426d17/ci_gitcode.git cie
          bash cie/common/common/merge.sh ${TARGET_BRANCH} ${REMOTE_URL} ${pr_id} ${WORKSPACE}
          cd ./CODE
          git diff-tree -r --name-only --no-commit-id origin/${TARGET_BRANCH} HEAD > ../modify_files.txt
          cat ../modify_files.txt
          cd -
          source cie/common/common/ccache_env.sh
          bash cie/common/build/op-plugin_build.sh ${pytorch_branch} ${py_version} ${pr_id} ${WORKSPACE} ${TARGET_BRANCH}
      - name: Upload to OBS
        uses: obs-upload
        with:
          endpoint: "obs.cn-north-4.myhuaweicloud.com"
          bucket: "pta-pr"
          access-key: "${{ secrets.OBS_AK }}"
          secret-key: "${{ secrets.OBS_SK }}"
          artifact-path: "*.tar.gz*"
          object-prefix: "op-plugin/PR/${{env.pr_id}}/"
