name: UT Job

on:
  workflow_call:
    inputs:
      branch_version:
        required: true
        type: string
        description: "分支版本 (master / v2_7_1 / v2_9_0 / v2_10_0 / v2_11_0 / v2_12_0)"
      job_suffix:
        required: false
        type: string
        default: ""
        description: "同一版本多 Job 时的后缀标识 (如 _01 / _02)"
      target_branch:
        required: false
        type: string
        default: "26.1.0"

jobs:
  ut:
    name: UT_${{ inputs.branch_version }}_ARM${{ inputs.job_suffix }}
    runs-on:
      - default
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/modelfoundry/karmada:latest
      options: --user root
    steps:
      - name: Checkout
        uses: checkout
      - name: Create UT script
        uses: official_shell_plugin
        with:
          OFFICIAL_SHELL_SCRIPT_INPUT: |
            cat > shell.sh << EOF
            #!/bin/bash
            set -e
            rm -rf *
            git clone -b master https://codehub.devcloud.cn-north-4.huaweicloud.com/a9b188a62f334fc0963bcfb523426d17/ci_gitcode.git cie
            bash cie/common/common/merge.sh ${TARGET_BRANCH} ${REMOTE_URL} ${pr_id} ${workspace}
            cd ./CODE
            git diff-tree -r --name-only --no-commit-id origin/${TARGET_BRANCH} HEAD > ../modify_files.txt
            cat ../modify_files.txt
            cd -
            # 执行UT脚本 - ${{ inputs.branch_version }}${{ inputs.job_suffix }}
            EOF
      - name: Download file manage
        uses: official_shell_plugin
        with:
          OFFICIAL_SHELL_SCRIPT_INPUT: |
            wget -q https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/k8s/kubeconfig_karmada.key --no-check-certificate
      - name: Execute SWR container
        uses: official_shell_plugin
        with:
          OFFICIAL_SHELL_SCRIPT_INPUT: |
            /workspace/workflowtool/entrypoint.sh
