name: _Nightly_Build_ob

on:
  workflow_call:
    inputs:
      py_version:
        required: false
        type: string
        default: "3.10"
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}
      CP_DOCKER_IMG:
        required: true
        type: string
      pytorch_branch:
        required: true
        type: string

jobs:
  Compile:
    name: Compile
    select: selected_by_default
    runs-on: [ self-hosted, os=euler, role=compile ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}
      options: --user root -v /data/torchnpu-ccache:/ccache
    env:
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 10G
    steps:
      - name: print env
        run: |
          echo "[ self-hosted, build=build ]"
          echo "pytorch_branch=${{ inputs.pytorch_branch }}"
          echo "py_version=3.10"
          echo "CP_DOCKER_IMG=swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}"
          echo "REMOTE_URL=${{ inputs.REMOTE_URL }}"
          echo "TARGET_BRANCH=master"

      - name: checkout pytorch
        uses: checkout
        with:
          repository: https://gitcode.com/Ascend/pytorch.git
          ref: refs/heads/master
          path: pytorch
          fetch-depth: 1

      - name: install torch
        run: |
          torch_version=$(cat pytorch/requirements.txt | grep torch== | cut -c 8-25)
          nightly_date=${torch_version:10:8}
          echo "torch_version=${torch_version}"
          echo "nightly_date=${nightly_date}"

          if [ ${#nightly_date} -ne 8 ]; then
            ver=${torch_version:0:6}
            url_base="https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/torch/v${ver}"
          else
            ver=${torch_version}
            url_base="https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/torch/master/${nightly_date}"
          fi

          torch_url="${url_base}/torch-${ver}%2Bcpu-cp310-cp310-manylinux_2_28_aarch64.whl"
          echo "torch_url=${torch_url}"
          pip3 install $torch_url

      - name: checkout
        uses: checkout
        with:
          fetch-depth: 0

      - name: ccache init
        run: |
          ccache -M $CCACHE_MAXSIZE
          ccache -z
          ccache -s

      - name: compile
        run: |
          ls -al
          bash ci/build.sh --python=3.10 --pytorch=${{ inputs.pytorch_branch }}

      - name: record build info
        run: |
          WHL_FILE=$(basename $(ls dist/torch_npu*.whl))
          TORCH_VERSION=$(cat pytorch/requirements.txt | grep torch== | cut -c 8-25)
          BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')
          OP_PLUGIN_COMMIT=$(git rev-parse --short HEAD)
          PYTORCH_COMMIT=$(cd build/pytorch && git rev-parse --short HEAD)
          cat > dist/build_info.txt << EOF
          whl_file=${WHL_FILE}
          torch_version=${TORCH_VERSION}
          build_time=${BUILD_TIME}
          op_plugin_commit=${OP_PLUGIN_COMMIT}
          pytorch_commit=${PYTORCH_COMMIT}
          pytorch_branch=${{ inputs.pytorch_branch }}
          EOF
          cat dist/build_info.txt

      - name: ccache stats
        run: |
          ccache -s

      - name: Upload whl to OBS
        uses: obs-upload
        with:
          endpoint: "obs.cn-north-4.myhuaweicloud.com"
          bucket: "pytorch-package"
          access-key: "${{ secrets.OBS_AK }}"
          secret-key: "${{ secrets.OBS_SK }}"
          artifact-path: "dist/torch_npu*.whl"

      - name: Upload build info to artifact
        uses: upload-artifact
        with:
          name: build-info
          path: dist/build_info.txt