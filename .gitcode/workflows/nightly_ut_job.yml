name: Nightly UT Job

on:
  workflow_call:
    inputs:
      REMOTE_URL:
        required: false
        type: string
        default: ${{ env.ATOMGIT_REPOSITORY_URL }}
      CP_DOCKER_IMG:
        required: true
        type: string
      TEST_RANK:
        required: false
        type: string
      TEST_WORLD_SIZE:
        required: false
        type: string

jobs:
  UT:
    name: UT
    select: selected_by_default
    runs-on: [ self-hosted, os=euler ]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}
      options: --user root --volume /usr/local/Ascend:/usr/local/Ascend --volume /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi --device /dev/davinci0 --device /dev/davinci1 --device /dev/davinci2 --device /dev/davinci3 --device /dev/davinci4 --device /dev/davinci5 --device /dev/davinci6 --device /dev/davinci7 --device /dev/davinci_manager --device /dev/hisi_hdc
    env:
      TEST_RANK: ${{ inputs.TEST_RANK }}
      TEST_WORLD_SIZE: ${{ inputs.TEST_WORLD_SIZE }}
    steps:
      - name: print env
        run: |
          echo "CP_DOCKER_IMG=swr.cn-north-4.myhuaweicloud.com/frameworkptadapter/${{ inputs.CP_DOCKER_IMG }}"
          echo "REMOTE_URL=${{ inputs.REMOTE_URL }}"
          echo "TEST_RANK=${{ env.TEST_RANK }}"
          echo "TEST_WORLD_SIZE=${{ env.TEST_WORLD_SIZE }}"

      - name: checkout pytorch
        uses: checkout
        with:
          repository: https://gitcode.com/Ascend/pytorch.git
          ref: refs/heads/master
          path: pytorch
          fetch-depth: 1

      - name: install torch
        run: |
          torch_version=$(cat pytorch/requirements.txt | grep torch== | cut -c 8-25)
          nightly_date=${torch_version:10:8}
          echo "torch_version=${torch_version}"
          echo "nightly_date=${nightly_date}"

          if [ ${#nightly_date} -ne 8 ]; then
            ver=${torch_version:0:6}
            url_base="https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/torch/v${ver}"
          else
            ver=${torch_version}
            url_base="https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/pta/torch/master/${nightly_date}"
          fi

          torch_url="${url_base}/torch-${ver}%2Bcpu-cp310-cp310-manylinux_2_28_aarch64.whl"
          echo "torch_url=${torch_url}"
          pip3 install $torch_url

      - name: download build info from artifact
        uses: download-artifact
        with:
          name: build-info
          path: ./

      - name: read build info
        run: |
          cat build_info.txt
          WHL_FILE=$(grep whl_file build_info.txt | cut -d= -f2)
          echo "WHL_FILE=${WHL_FILE}"
          echo "WHL_FILE=${WHL_FILE}" >> $ATOMGIT_ENV

      - name: download op-plugin from OBS
        uses: obs-download
        with:
          endpoint: "obs.cn-north-4.myhuaweicloud.com"
          bucket: "pytorch-package"
          access-key: "${{ secrets.OBS_AK }}"
          secret-key: "${{ secrets.OBS_SK }}"
          key: "artifacts/${{ env.WHL_FILE }}"
          local-path: "./"

      - name: Verify artifact
        run: |
          ls -al
          pip3 install ${{ env.WHL_FILE }}
        working-directory: ./

      - name: checkout op-plugin
        uses: checkout
        with:
          fetch-depth: 1

      - name: generate modify_files.txt for full UT
        run: |
          git ls-files > modify_files.txt
          echo "Total files for full UT: $(wc -l < modify_files.txt)"

      - name: UT_op-plugin
        shell: bash {0}
        run: |
          set +e
          echo "=== source /etc/profile ==="
          source /etc/profile
          echo "=== source CANN ==="
          source /usr/local/Ascend/cann/set_env.sh
          echo "=== source ATB ==="
          source /usr/local/Ascend/nnal/atb/set_env.sh
          echo "=== environment ==="
          env | grep -iE "ascend|cann|npu" || echo "No ASCEND/CANN/NPU env vars"
          echo "=== check npu-smi ==="
          npu-smi info 2>&1 || echo "npu-smi not available"
          echo "=== check /dev/davinci ==="
          ls -la /dev/davinci* 2>&1 || echo "No /dev/davinci devices"
          echo "=== check Ascend dir ==="
          ls /usr/local/Ascend/ 2>&1 || echo "/usr/local/Ascend not found"
          echo "=== python3 check ==="
          python3 -c "import torch; print('torch ok', torch.__version__)" 2>&1 || echo "torch import failed"
          python3 -c "import torch_npu; print('torch_npu ok', torch_npu.__version__)" 2>&1 || echo "torch_npu import failed"
          python3 -c "import torch_npu; print('device_count:', torch_npu.npu.device_count())" 2>&1 || echo "torch_npu.npu.device_count() failed"
          echo "=== run UT ==="
          export PTA_UT_EXEC_TIMEOUT=4800
          python3 ci/nightly_ut_debug.py --rank=${{ env.TEST_RANK }} --world_size=${{ env.TEST_WORLD_SIZE }}
          exit_code=$?
          echo "UT exit code: ${exit_code}"
          exit ${exit_code}

      - name: checkout pytorch for UT
        uses: checkout
        with:
          repository: https://gitcode.com/Ascend/pytorch.git
          ref: refs/heads/master
          path: pytorch
          submodules: true

      - name: generate pytorch modify_files.txt for full UT
        run: |
          cd pytorch && git ls-files > modify_files.txt
          echo "Total pytorch files for full UT: $(wc -l < modify_files.txt)"

      - name: UT_pytorch
        run: |
          ls -al
          if [ -f "pytorch/ci/split_by_time.py" ]; then
            sed -i "s/'op-plugin' in str(Path(ut_file))/str(NETWORK_OPS_DIR) in str(Path(ut_file))/g" pytorch/ci/split_by_time.py
          fi
          if [ -f "pytorch/ci/access_control_test.py" ]; then
            sed -i "s/'op-plugin' in str(Path(ut_file))/str(NETWORK_OPS_DIR) in str(Path(ut_file))/g" pytorch/ci/access_control_test.py
          fi
          pip3 list
          source /etc/profile
          export PTA_UT_EXEC_TIMEOUT=4800
          source /usr/local/Ascend/cann/set_env.sh
          source /usr/local/Ascend/nnal/atb/set_env.sh
          python3 pytorch/ci/access_control_test.py --rank=${{ env.TEST_RANK }} --world_size=${{ env.TEST_WORLD_SIZE }}