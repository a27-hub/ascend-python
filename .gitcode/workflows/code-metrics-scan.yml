name: code-metrics-scan

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 7.3.0
  schedule:
    - cron: "0 0 0 * * ?"

permissions:
  id-token: write

jobs:
  code-metrics-scan:
    name: 代码度量检测
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout
        run: |
          git clone --depth=1 https://gitcode.com/ComputingActionTest/op-plugin.git .

      - name: code-metrics-scan
        uses: openlibing/code-metrics-action@95623b0e88eaaed34eac28da21df52f4ac33a2b8
        with:
          # 可选：排除指定目录/文件，不传 exclude-dirs 默认全路径扫描
          exclude-dirs: ".git,.gitcode,build,vendor"
          # 可选：指定扫描的文件扩展名（覆盖式）；不传时按内置缺省白名单扫描
          # allowed-extensions: ".c,.cpp,.h,.py"
