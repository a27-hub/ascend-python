post:
  select: always
  jobs:
    Mark_PR_pipeline_result:
      name: Mark_PR_pipeline_result
      steps:
        - name: Mark PR pipeline result
          uses: cann/.gitcode/actions/query-pipeline@master
          with:
            owner: ${{ env.org_name }}
            repo: ${{ env.repo }}
            run_id: ${{ atomgit.workflow_run_id }}
            token: ${{ secrets.GIT_TOKEN_LABELS }}
            pr_number: ${{ env.pr_id }}
            apply_label: 'true'
