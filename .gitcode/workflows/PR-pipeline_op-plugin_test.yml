name: PR-pipeline_op-plugin

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  pull_request_comment:
    types: [created]
    branches: [ '*' ]
    comments: [ '^(?:\/)?compile*' ]

permissions:
  project: read
  repository: read
  pr: write

env:
  repo: ${{ atomgit.event.repository.name }}
  pr_id: ${{ atomgit.event.pull_request.number }}
  org_name: "ComputingActionTest"
  img_master_arm: "pytorch_2.13.0_a2_aarch64_builder:20260709"
  img_2_7_1_arm: "pytorch_2.7.1_a2_aarch64_builder:20260518"
  img_2_9_0_arm: "pytorch_2.9.0_a2_aarch64_builder:20260518"
  img_2_10_0_arm: "pytorch_2.10.0_a2_aarch64_builder:20260518"
  img_2_11_0_arm: "pytorch_2.11.0_a2_aarch64_builder:20260518"
  img_2_12_0_arm: "pytorch_2.12.0_a2_aarch64_builder:20260518"
  img_master_x86: "pytorch_2.13.0_a1_x86_64_builder:20260709"
  img_2_7_1_x86: "pytorch_2.7.1_a1_x86_64_builder:20260418"
  img_2_9_0_x86: "pytorch_2.9.0_a1_x86_64_builder:20260518"
  img_2_10_0_x86: "pytorch_2.10.0_a1_x86_64_builder:20260418"
  img_2_11_0_x86: "pytorch_2.11.0_a1_x86_64_builder:20260418"
  img_2_12_0_x86: "pytorch_2.12.0_a1_x86_64_builder:20260518"

stages:

  stage_1:
    name: stage_1
    select: selected_by_default
    jobs:
      PR_label_pre:
          name: PR_label_pre
          runs-on: [ self-hosted, openeuler, x86, cpu=32 ]
          steps:
            - name: Mark PR pipeline as running
              uses: cann/.gitcode/actions/pre-pipeline@master
              with:
                owner: ${{ env.org_name }}
                repo: ${{ env.repo }}
                pr_number: ${{ env.pr_id }}
                token: ${{ secrets.GIT_TOKEN_LABELS }}
                apply_label: 'true'
            - name: Generate 50G artifact test files
              run: |
                TEST_DIR="artifact-size-test-50G"
                FILE_SIZE=2000000000
                TOTAL_SIZE=50000000000
                rm -rf -- "${TEST_DIR}"
                mkdir -p "${TEST_DIR}"
                for index in $(seq -w 1 25); do
                  TEST_FILE="${TEST_DIR}/chunk-${index}.bin"
                  head -c "${FILE_SIZE}" /dev/urandom > "${TEST_FILE}"
                  test "$(stat -c '%s' "${TEST_FILE}")" -eq "${FILE_SIZE}"
                done
                test "$(find "${TEST_DIR}" -type f | wc -l)" -eq 25
                test "$(find "${TEST_DIR}" -type f -printf '%s\n' | awk '{total += $1} END {print total}')" -eq "${TOTAL_SIZE}"
                du -sh "${TEST_DIR}"
            - name: Upload 50G artifact chunk 01
              uses: upload-artifact
              with:
                name: artifact-size-test-50G-01
                path: artifact-size-test-50G/chunk-01.bin
                overwrite: true
            - name: Upload 50G artifact chunk 02
              uses: upload-artifact
