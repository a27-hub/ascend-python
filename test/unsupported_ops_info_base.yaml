
熟练使用C++，python语言，熟悉Pybinding应用。掌握常用的数据结构和算法，以及相应的设计模式，在工作中有实际应用。
有较好的开发调试能力，具备定位和解决进程coredump和卡死问题，可以较好的使用pdb，gdb等调试工具定位代码问题。
熟悉PyTorch框架实现（包括c10，ATen库中的）及其分布式特性，洞察社区动发展，有原生贡献经验；对PyTorch的多个模块文档与代码进行过深入的阅读和开发调试。
具备大规模集群训练经验，可以分析定位模型或算子精度问题；熟练使用profiling和memory snapshot工具，可以分析模型训练中的性能和内存使用是否符合预期(定位快慢卡,性能劣化问题)。
对于Megatron、TransformerEngine、vllm、deepspeed等三方套件生态优化实现也较为了解。
