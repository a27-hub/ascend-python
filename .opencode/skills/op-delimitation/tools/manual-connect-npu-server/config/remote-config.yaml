# 使用者复制本文件为 remote-config.yaml 后填写真实值（或直接在 remote-config.yaml 上改）。
# 本 skill 三档认证（详见 SKILL.md「认证策略」）：
#   ① 默认：直接 ssh -i <key_path> -p <ssh.port> <ssh.user>@<ssh.host>（永久免密）；
#   ② 联不通：走 SKILL.md「首次装机 — Windows」两步，**仅这一次**在交互提示里键入远端密码；
#   ③ 兜底：本机暂无 OpenSSH / 装不上时，由模型按需生成一次性 python 脚本，密码仅在
#       用户本机当次 python 进程内中转，绝不写入本文件、md、.env、shell history 或聊天。
# 硬禁（任何情况下都不允许）：sshpass / expect / pexpect / ssh -o PreferredAuthentications=password ...
#   / 把远端密码以任何形式写入本文件或其它持久层。
# Windows 常见私钥路径：
#   C:/Users/<WINDOWS_USER>/.ssh/id_ed25519

ssh:
  host: "<SSH_HOST>"            # 例：141.61.49.25（用户提供）
  port: 22                       # 默认 22；用户另指定时改写
  user: "<SSH_USER>"            # 默认 root；用户另指定时改写
  key_path: "<LOCAL_SSH_PRIVATE_KEY_PATH>"  # 例：C:/Users/<WINDOWS_USER>/.ssh/id_ed25519

local:
  workspace: "<LOCAL_WORKSPACE>"
  torch_npu_dir: "<LOCAL_TORCH_NPU_DIR>"
  torch_native_dir: "<LOCAL_TORCH_NATIVE_DIR>"
  testcase_dir: "<LOCAL_TESTCASE_DIR>"

remote:
  workspace: "<REMOTE_WORKSPACE>"
  scope: "<REMOTE_ALLOWED_WRITE_SCOPE>"
  torch_npu_dir: "<REMOTE_TORCH_NPU_DIR>"
  torch_native_dir: "<REMOTE_TORCH_NATIVE_DIR>"
  testcase_dir: "<REMOTE_TESTCASE_DIR>"
  log_dir: "<REMOTE_LOG_DIR>"

environment:
  setup_cmd: "<AFTER_CONTAINER_OR_CONDA_SOURCE_SET_ENV>"

conda:
  init_script: "<CONDA_INIT_SCRIPT_OR_EMPTY>"
  env_name: "<CONDA_ENV_OR_EMPTY>"

container:
  use_container: true
  runtime: "docker"
  name: "<CONTAINER_NAME_OR_EMPTY>"

sync:
  method: "rsync"

session:
  mode: "stateless"
  persistent_backend: "tmux"
  name: "<TMUX_SESSION_NAME_OR_EMPTY>"

commands:
  build: ""
  test: ""
  run: ""
  clean: ""
  find_log: ""
