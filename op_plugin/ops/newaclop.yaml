- filename: IntReprQuantKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n#ifdef VERSION_V2R2\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nnamespace {\nat::Tensor int_repr_quantized_nocheck(const at::Tensor& self)\n{\n    auto dtype = self.scalar_type();\n    auto output_dtype = at::kInt;\n    if (dtype == at::ScalarType::QInt8) {\n        output_dtype = at::kChar;\n    } else if (dtype == at::ScalarType::QUInt8) {\n        output_dtype = at::kByte;\n    }\n    at::Tensor tmp = at::empty(\n        self.sizes(),\n        self.options().dtype(output_dtype).memory_format(self.suggest_memory_format()));\n    at::Tensor result = at::empty(\n        self.sizes(),\n        self.options().dtype(output_dtype).memory_format(self.suggest_memory_format()));\n\n    at_npu::native::NPUNativeFunctions::set_(tmp, self);\n    result = at_npu::native::custom_ops::npu_dtype_cast(tmp, output_dtype);\n\n    return result;\n}\n} // namespace\n\nat::Tensor int_repr(const at::Tensor& self)\n{\n    return int_repr_quantized_nocheck(self);\n}\n} // namespace acl_op\n#endif\n"
- filename: SlowConvDilated2dBackwardKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n#include <algorithm>\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nnamespace {\ninline bool all_positive(at::IntArrayRef &arr)\n{\n    return std::all_of(arr.begin(), arr.end(), [](int64_t item) { return item > 0; });\n}\n\nat::Tensor &slow_conv_dilated2d_backward_input_out_nocheck(at::Tensor &grad_input, const at::Tensor &grad_output,\n                                                           const at::Tensor &self, const at::Tensor &weight,\n                                                           at::IntArrayRef kernel_size, at::IntArrayRef stride,\n                                                           at::IntArrayRef padding, at::IntArrayRef dilation)\n{\n    c10::SmallVector<int64_t, N> strides_size = {1, 1, stride[0], stride[1]};\n    c10::SmallVector<int64_t, N> paddings = {padding[0], padding[0], padding[1], padding[1]};\n    c10::SmallVector<int64_t, N> dilations = {1, 1, dilation[0], dilation[1]};\n    string data_formats = \"NCHW\";\n    int64_t groups = 1;\n    c10::SmallVector<int64_t, N> dim_list = op_infer::array_to_small_vector(self.sizes());\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"Conv2DBackpropInput\")\n        .Input(dim_list, at::kInt)\n        .Input(weight, \"filter\")\n        .Input(grad_output, \"out_backprop\")\n        .Output(grad_input, \"y\")\n        .Attr(\"strides\", strides_size)\n        .Attr(\"pads\", paddings)\n        .Attr(\"dilations\", dilations)\n        .Attr(\"groups\", groups)\n        .Attr(\"data_format\", data_formats)\n        .Run();\n\n    return grad_input;\n}\n\nat::Tensor &slow_conv_dilated2d_backward_weight_out_nocheck(at::Tensor &grad_weight, const at::Tensor &grad_output,\n                                                            const at::Tensor &self, const at::Tensor &weight,\n                                                            at::IntArrayRef kernel_size, at::IntArrayRef stride,\n                                                            at::IntArrayRef padding, at::IntArrayRef dilation)\n{\n    c10::SmallVector<int64_t, N> strides_size = {1, 1, stride[0], stride[1]};\n    c10::SmallVector<int64_t, N> paddings = {padding[0], padding[0], padding[1], padding[1]};\n    c10::SmallVector<int64_t, N> dilations = {1, 1, dilation[0], dilation[1]};\n    string data_formats = \"NCHW\";\n    int64_t groups = 1;\n    c10::SmallVector<int64_t, N> dim_list = op_infer::array_to_small_vector(weight.sizes());\n\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"Conv2DBackpropFilter\")\n        .Input(self, \"x\")\n        .Input(dim_list, at::kInt)\n        .Input(grad_output, \"out_backprop\")\n        .Output(grad_weight)\n        .Attr(\"strides\", strides_size)\n        .Attr(\"pads\", paddings)\n        .Attr(\"dilations\", dilations)\n        .Attr(\"groups\", groups)\n        .Attr(\"data_format\", data_formats)\n        .Run();\n\n    return grad_weight;\n}\n\nat::Tensor &slow_conv_dilated2d_backward_bias_out_check(at::Tensor &grad_bias, const at::Tensor &grad_output,\n                                                        const at::Tensor &self, const at::Tensor &weight,\n                                                        at::IntArrayRef kernel_size, at::IntArrayRef stride,\n                                                        at::IntArrayRef padding, at::IntArrayRef dilation)\n{\n    string data_formats = \"NCHW\";\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"BiasAddGrad\").Input(self).Output(grad_bias).Attr(\"data_format\", data_formats).Run();\n\n    return grad_bias;\n}\n\nstd::tuple<at::Tensor &, at::Tensor &, at::Tensor &> slow_conv_dilated2d_backward_out_nocheck(\n    at::Tensor &grad_input, at::Tensor &grad_weight, at::Tensor &grad_bias, const at::Tensor &grad_output,\n    const at::Tensor &self, const at::Tensor &weight, at::IntArrayRef kernel_size, at::IntArrayRef stride,\n    at::IntArrayRef padding, at::IntArrayRef dilation, std::array<bool, 3> output_mask)\n{\n    TORCH_CHECK(kernel_size.size() == 2, \"kernel sizes length should be 2, but got \", kernel_size.size(),\n        OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(stride.size() == 2, \"strides length should be 2, but got \", stride.size(),\n        OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(dilation.size() == 2, \"dilations length should be 2, but got \", dilation.size(),\n        OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(padding.size() == 2, \"pads length should be 2, but got \", padding.size(),\n        OPS_ERROR(ErrCode::PARAM));\n\n    TORCH_CHECK(all_positive(kernel_size), \"kernel size should be greater than zero, but got \", kernel_size,\n        OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(all_positive(stride), \"stride should be greater than zero, but got \", stride,\n        OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(all_positive(dilation), \"dilation should be greater than zero, but got \", dilation,\n        OPS_ERROR(ErrCode::PARAM));\n    if (output_mask[0]) {\n        slow_conv_dilated2d_backward_input_out_nocheck(grad_input, grad_output, self, weight, kernel_size, stride,\n                                                       padding, dilation);\n    }\n    if (output_mask[1]) {\n        slow_conv_dilated2d_backward_weight_out_nocheck(grad_weight, grad_output, self, weight, kernel_size, stride,\n                                                        padding, dilation);\n    }\n    if (output_mask[2]) {\n        slow_conv_dilated2d_backward_bias_out_check(grad_bias, grad_output, self, weight, kernel_size, stride, padding,\n                                                    dilation);\n    }\n\n    return std::tuple<at::Tensor &, at::Tensor &, at::Tensor &>(grad_input, grad_weight, grad_bias);\n}\n} // namespace\n\nstd::tuple<at::Tensor, at::Tensor, at::Tensor> slow_conv_dilated2d_backward(\n    const at::Tensor &grad_output, const at::Tensor &self, const at::Tensor &weight, at::IntArrayRef kernel_size,\n    at::IntArrayRef stride, at::IntArrayRef padding, at::IntArrayRef dilation, std::array<bool, 3> output_mask)\n{\n    at::Tensor undefined;\n    at::Tensor grad_input = (output_mask[0] ? npu_preparation::apply_tensor(grad_output, self.sizes()) : undefined);\n    at::Tensor grad_weight = (output_mask[1] ? npu_preparation::apply_tensor(grad_output, weight.sizes()) : undefined);\n    at::Tensor grad_bias = (output_mask[2] ? npu_preparation::apply_tensor(grad_output, weight.size(0)) : undefined);\n\n    slow_conv_dilated2d_backward_out_nocheck(grad_input, grad_weight, grad_bias, grad_output, self, weight, kernel_size,\n                                             stride, padding, dilation, output_mask);\n\n    return std::tie(grad_input, grad_weight, grad_bias);\n}\n} // namespace acl_op\n"
- filename: SignBitsUnpackKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nat::Tensor npu_sign_bits_unpack(\n    const at::Tensor& input,\n    int64_t size,\n    c10::ScalarType dtype) {\n    int64_t dim = input.dim();\n    TORCH_CHECK(dim == 1, \"input value should be a 1-dimensional tensor\" + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(input.scalar_type() == at::ScalarType::Byte, \"sign_bits_unpack input only supports torch.uint8 \"\n        + OPS_ERROR(ErrCode::TYPE));\n    TORCH_CHECK(size > 0, \"The argument 'size' is not valid because it is less than or equal to zero\"\n        + OPS_ERROR(ErrCode::PARAM));\n\n    int64_t input_size = input.numel();\n    TORCH_CHECK((input_size * 8) % size == 0, \"input value length*8 must be multiple of size\" + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(dtype == at::ScalarType::Float || dtype == at::ScalarType::Half, \"The argument 'dtype'  must be torch.float32 or torch.float16\"\n        + OPS_ERROR(ErrCode::TYPE));\n    int64_t m = input_size * 8 / size;\n    at::Tensor result = npu_preparation::apply_tensor({size, m}, input.options().dtype(dtype), input);\n\n    int64_t type_enum = dtype == at::ScalarType::Half ? 1 : 0;\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"SignBitsUnpack\")\n        .Input(input)\n        .Output(result)\n        .Attr(\"dtype\", type_enum)\n        .Attr(\"size\", size)\n        .Run();\n    return result;\n}\n\n} // namespace acl_op\n"
- filename: SincKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\n\nat::Tensor& sinc_out(const at::Tensor& self, at::Tensor& result) {\n  TORCH_NPU_WARN_ONCE(\n      \"Warning: kernel [sinc] is not supported by NPU currently. Now this kernel is running on CPU.\");\n  const auto self_cpu = self.to(\"cpu\");\n  auto result_cpu = result.to(\"cpu\");\n  at::sinc_out(result_cpu, self_cpu);\n  result.copy_(result_cpu);\n  return result;\n}\n\nat::Tensor sinc(const at::Tensor& self) {\n  TORCH_NPU_WARN_ONCE(\n      \"Warning: kernel [sinc] is not supported by NPU currently. Now this kernel is running on CPU.\");\n  const auto self_cpu = self.to(\"cpu\");\n  at::sinc(self_cpu);\n  return at::sinc(self_cpu).to(self.device());\n}\n\nat::Tensor& sinc_(at::Tensor& self) {\n  TORCH_NPU_WARN_ONCE(\n      \"Warning: kernel [sinc] is not supported by NPU currently. Now this kernel is running on CPU.\");\n  auto self_cpu = self.to(\"cpu\");\n  at::sinc_(self_cpu);\n  self.copy_(self_cpu);\n  return self;\n}\n\n} // namespace acl_op\n"
- filename: CdistKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nat::Tensor _cdist_forward(const at::Tensor &x1, const at::Tensor &x2, const double p,\n                          c10::optional<int64_t> compute_mode)\n{\n    TORCH_CHECK(x1.dim() >= 2, \"cdist only supports at least 2D tensors, X1 got: \", x1.dim(), \"D\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(x2.dim() >= 2, \"cdist only supports at least 2D tensors, X2 got: \", x2.dim(), \"D\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(x1.size(-1) == x2.size(-1), \"X1 and X2 must have the same number of columns. X1: \", x1.size(-1),\n        \" X2: \", x2.size(-1),\n        OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(at::isFloatingType(x1.scalar_type()),\n        \"cdist only supports floating-point dtypes, X1 got: \", x1.scalar_type(),\n        OPS_ERROR(ErrCode::TYPE));\n    TORCH_CHECK(at::isFloatingType(x1.scalar_type()),\n        \"cdist only supports floating-point dtypes, X2 got: \", x2.scalar_type(),\n        OPS_ERROR(ErrCode::TYPE));\n    TORCH_CHECK(p >= 0, \"cdist only supports non-negative p values\" + OPS_ERROR(ErrCode::PARAM));\n\n    // Since double is not supported in NPU, the type of P needs to be converted from double to float.\n    float p_float;\n    if (std::isinf(p)) {\n        p_float = -1;\n    } else {\n        TORCH_CHECK(p <= std::numeric_limits<float>::max(), \"npu does not support float64\"\n            + OPS_ERROR(ErrCode::TYPE));\n        p_float = static_cast<float>(p);\n    }\n\n    int64_t mode = compute_mode.value_or(0);\n    TORCH_CHECK(mode >= 0 && mode <= 2, \"possible modes: 0, 1, 2, but was: \", mode,\n        OPS_ERROR(ErrCode::VALUE));\n\n    // Broadcast\n    int64_t c1 = x1.size(-1);\n    int64_t c2 = x2.size(-1);\n    int64_t r1 = x1.size(-2);\n    int64_t r2 = x2.size(-2);\n    auto dim1 = x1.dim();\n    auto dim2 = x2.dim();\n\n    at::IntArrayRef batch_tensor1(x1.sizes().data(), dim1 - 2);\n    at::IntArrayRef batch_tensor2(x2.sizes().data(), dim2 - 2);\n    std::vector<int64_t> expand_batch_portion = at::infer_size(batch_tensor1, batch_tensor2);\n    std::vector<int64_t> tensor1_expand_size(expand_batch_portion);\n    tensor1_expand_size.insert(tensor1_expand_size.end(), {r1, c1});\n    std::vector<int64_t> tensor2_expand_size(expand_batch_portion);\n    tensor2_expand_size.insert(tensor2_expand_size.end(), {r2, c2});\n\n    int expand_batch_product =\n        std::accumulate(expand_batch_portion.begin(), expand_batch_portion.end(), 1, std::multiplies<int64_t>());\n    std::vector<int64_t> tensor1_view{expand_batch_product, r1, 1, c1};\n    std::vector<int64_t> tensor2_view{expand_batch_product, 1, r2, c2};\n    std::vector<int64_t> result_size{expand_batch_product, r1, r2};\n    std::vector<int64_t> tensor_broadcast_size = at::infer_size(tensor1_view, tensor2_view);\n\n    // Broadcast batch dim.\n    at::Tensor tensor1_expanded = x1.expand(tensor1_expand_size).contiguous().view(tensor1_view);\n    at::Tensor tensor2_expanded = x2.expand(tensor2_expand_size).contiguous().view(tensor2_view);\n\n    // Broadcast r1 and r2.\n    at::Tensor tensor1_broadcast = tensor1_expanded.expand(tensor_broadcast_size).contiguous();\n    at::Tensor tensor2_broadcast = tensor2_expanded.expand(tensor_broadcast_size).contiguous();\n\n    auto output_size = op_infer::cdist_npu_output_size(x1, x2);\n    at::Tensor result = npu_preparation::apply_tensor(tensor1_broadcast, result_size);\n\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"Cdist\").Input(tensor1_broadcast).Input(tensor2_broadcast).Attr(\"p\", p_float).Output(result).Run();\n    return result.view(output_size);\n}\n\nat::Tensor cdist(const at::Tensor &x1, const at::Tensor &x2, const double p, c10::optional<int64_t> compute_mode)\n{\n    return at::_cdist_forward(x1, x2, p, compute_mode);\n}\n} // namespace acl_op\n"
