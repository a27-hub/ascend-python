- filename: MaxUnpool3dKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\ninline void max_unpool3d_check(const at::Tensor &self, const at::Tensor &indices, at::IntArrayRef output_size)\n{\n    TORCH_CHECK(output_size.size() == 3, \"There should be exactly 3 elements (depth, height, width) in output_size\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK((self.ndimension() == 4 || self.ndimension() == 5),\n        \"Input to max_unpooling2d should be a 4d or 5d Tensor\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(self.sizes() == indices.sizes(), \"Shape of indices should match shape of input\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(self.numel() > 0, \"Input must be non-empty\"\n        + OPS_ERROR(ErrCode::PARAM));\n}\n\nat::Tensor &max_unpool3d_out_nocheck(at::Tensor &result, const at::Tensor &self, const at::Tensor &indices,\n                                     const at::Tensor &data, at::IntArrayRef output_size)\n{\n    int64_t N = 1;\n    int64_t C = self.size(0);\n    if (self.dim() == 5) {\n        N = self.size(0);\n        C = self.size(1);\n    }\n    at::Tensor reshape_self = self.reshape({N, C, -1});\n    at::Tensor reshape_indices = indices.reshape({N, C, -1});\n    at::Tensor reshape_data = data.reshape({N, C, -1});\n    result = result.reshape({N, C, -1});\n\n    int64_t axis = 2;\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"ScatterElements\")\n        .Input(reshape_data)\n        .Input(reshape_indices)\n        .Input(reshape_self)\n        .Output(result)\n        .Attr(\"axis\", axis)\n        .Run();\n    result = result.reshape({data.sizes()});\n    return result;\n}\n} // namespace\n\nat::Tensor &max_unpool3d_out(const at::Tensor &self, const at::Tensor &indices, at::IntArrayRef output_size,\n                             at::IntArrayRef stride, at::IntArrayRef padding, at::Tensor &result)\n{\n    max_unpool3d_check(self, indices, output_size);\n    auto out_shape = op_infer::max_pool3d_output_size(self, output_size);\n    at::Tensor data = at::zeros(out_shape, self.options());\n\n    npu_preparation::CheckOut({self, indices, data}, result, data);\n    if (!npu_utils::check_match(&result)) {\n        at::Tensor contiguous_result = npu_utils::format_contiguous(result);\n        max_unpool3d_out_nocheck(contiguous_result, self, indices, data, output_size);\n        npu_utils::format_fresh_view(result, contiguous_result);\n    } else {\n        max_unpool3d_out_nocheck(result, self, indices, data, output_size);\n    }\n\n    return result;\n}\n\nat::Tensor max_unpool3d(const at::Tensor &self, const at::Tensor &indices, at::IntArrayRef output_size,\n                        at::IntArrayRef stride, at::IntArrayRef padding)\n{\n    max_unpool3d_check(self, indices, output_size);\n    auto out_shape = op_infer::max_pool3d_output_size(self, output_size);\n    at::Tensor data = at::zeros(out_shape, self.options());\n    at::Tensor result = npu_preparation::apply_tensor(data);\n    max_unpool3d_out_nocheck(result, self, indices, data, output_size);\n\n    return result;\n}\n} // namespace acl_op\n"
- filename: LstmCellKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"torch_npu/csrc/aten/CustomFunctions.h\"\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\nusing tuple_tensor =\n    std::tuple<at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor>;\nusing tensor_list = std::tuple<at::Tensor &, at::Tensor &, at::Tensor &, at::Tensor &, at::Tensor &, at::Tensor &>;\nusing tensor_list7 = std::tuple<at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor, at::Tensor>;\n\nnamespace {\ntuple_tensor lstm_cell_npu_impl(const at::Tensor &input, const at::Tensor &w_ih, const at::Tensor &w_hh,\n                                const at::Tensor &h, const at::Tensor &c, const at::Tensor &bias)\n{\n    at::Tensor input_reshape = input.reshape({1, input.size(0), input.size(1)});\n    at::Tensor h_reshape = h.reshape({1, h.size(0), h.size(1)});\n    at::Tensor c_reshape = c.reshape({1, c.size(0), c.size(1)});\n    int64_t num_step = input_reshape.size(0);\n    int64_t batch_size = input_reshape.size(1);\n    int64_t hidden_size = w_hh.size(1) / 4;\n\n    at::SmallVector<int64_t, SIZE> output_size = {num_step, batch_size, hidden_size};\n    at::Tensor y_output = npu_preparation::apply_tensor(input_reshape, output_size);\n    at::Tensor h_output = npu_preparation::apply_tensor(input_reshape, output_size);\n    at::Tensor c_output = npu_preparation::apply_tensor(input_reshape, output_size);\n    at::Tensor i_output = npu_preparation::apply_tensor_with_format(input_reshape, output_size, ACL_FORMAT_FRACTAL_NZ);\n    at::Tensor j_output = npu_preparation::apply_tensor_with_format(input_reshape, output_size, ACL_FORMAT_FRACTAL_NZ);\n    at::Tensor f_output = npu_preparation::apply_tensor_with_format(input_reshape, output_size, ACL_FORMAT_FRACTAL_NZ);\n    at::Tensor o_output = npu_preparation::apply_tensor_with_format(input_reshape, output_size, ACL_FORMAT_FRACTAL_NZ);\n    at::Tensor tanhc = npu_preparation::apply_tensor_with_format(input_reshape, output_size, ACL_FORMAT_FRACTAL_NZ);\n\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"DynamicRNNV2\").Input(input_reshape).Input(w_ih).Input(w_hh);\n    if (bias.defined()) {\n        cmd.Input(bias);\n    } else {\n        cmd.Input();\n    }\n    cmd.Input()\n        .Input(h_reshape)\n        .Input(c_reshape)\n        .Output(y_output)\n        .Output(h_output)\n        .Output(c_output)\n        .Output(i_output)\n        .Output(j_output)\n        .Output(f_output)\n        .Output(o_output)\n        .Output(tanhc)\n        .Attr(\"cell_type\", (string) \"LSTM\")\n        .Attr(\"direction\", (string) \"UNIDIRECTIONAL\")\n        .Attr(\"cell_depth\", (int64_t)1)\n        .Attr(\"use_peephole\", (bool)false)\n        .Attr(\"keep_prob\", (float)1.0)\n        .Attr(\"cell_clip\", (float)-1.0)\n        .Attr(\"num_proj\", (int64_t)0)\n        .Attr(\"time_major\", (bool)true)\n        .Attr(\"activation\", (string) \"tanh\")\n        .Attr(\"forget_bias\", (float)0.0)\n        .Attr(\"gate_order\", (string) \"ifco\")\n        .Run();\n    at::Tensor h_out = h_output[0];\n    at::Tensor c_out = c_output[0];\n    return std::make_tuple(y_output, h_out, c_out, i_output, j_output, f_output, o_output, tanhc);\n}\n\ntensor_list lstm_cell_backward_npu_impl_nocheck(\n    at::Tensor &grad_input, at::Tensor &grad_wih, at::Tensor &grad_whh, at::Tensor &grad_bias, at::Tensor &grad_ht,\n    at::Tensor &grad_ct, const at::Tensor &grad_y, const at::Tensor &grad_h, const at::Tensor &grad_c,\n    const at::Tensor &input, const at::Tensor &w_ih, const at::Tensor &w_hh, const at::Tensor &h, const at::Tensor &c,\n    const at::Tensor &y_output, const at::Tensor &h_output, const at::Tensor &c_output, const at::Tensor &i,\n    const at::Tensor &j, const at::Tensor &f, const at::Tensor &o, const at::Tensor &tanhc)\n{\n    at::Tensor seq_length = at::zeros({}, input.options());\n    at::Tensor mask = at::zeros({}, input.options().dtype(at::kByte));\n    at::Tensor wci = at::zeros({}, input.options());\n    at::Tensor wcf = at::zeros({}, input.options());\n    at::Tensor wco = at::zeros({}, input.options());\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"DynamicRNNV2Grad\")\n        .Input(input)\n        .Input(w_ih)\n        .Input(w_hh)\n        .Input(y_output)\n        .Input(h)\n        .Input(c)\n        .Input(h_output)\n        .Input(c_output)\n        .Input(grad_y)\n        .Input(grad_h)\n        .Input(grad_c)\n        .Input(i)\n        .Input(j)\n        .Input(f)\n        .Input(o)\n        .Input(tanhc)\n        .Input(seq_length)\n        .Input(wci)\n        .Input(wcf)\n        .Input(wco)\n        .Input(mask)\n        .Output(grad_wih)\n        .Output(grad_whh)\n        .Output(grad_bias)\n        .Output(grad_input)\n        .Output(grad_ht)\n        .Output(grad_ct)\n        .Attr(\"cell_type\", (string) \"LSTM\")\n        .Attr(\"direction\", (string) \"UNIDIRECTIONAL\")\n        .Attr(\"cell_depth\", (int64_t)1)\n        .Attr(\"use_peephole\", (bool)false)\n        .Attr(\"keep_prob\", (float)1.0)\n        .Attr(\"cell_clip\", (float)-1.0)\n        .Attr(\"num_proj\", (int64_t)0)\n        .Attr(\"time_major\", (bool)true)\n        .Attr(\"activation\", (string) \"tanh\")\n        .Attr(\"recurrent_activation\", (string) \"sigmoid\")\n        .Attr(\"gate_order\", (string) \"ifjo\")\n        .Attr(\"stateful\", (bool)false)\n        .Attr(\"merge_mode\", (string) \"concat\")\n        .Run();\n\n    return std::tie(grad_input, grad_wih, grad_whh, grad_bias, grad_ht, grad_ct);\n}\n} // namespace\n\ntensor_list7 npu_lstm_cell_backward(const c10::optional<at::Tensor> &grad_y_opt,\n                                    const c10::optional<at::Tensor> &grad_h_opt,\n                                    const c10::optional<at::Tensor> &grad_c_opt, const at::Tensor &input,\n                                    const at::Tensor &w_ih, const at::Tensor &w_hh, const at::Tensor &h,\n                                    const at::Tensor &c, const at::Tensor &y_output, const at::Tensor &h_output,\n                                    const at::Tensor &c_output, const at::Tensor &i, const at::Tensor &j,\n                                    const at::Tensor &f, const at::Tensor &o, const at::Tensor &tanhc)\n{\n    const at::Tensor &grad_y_opt_val = c10::value_or_else(grad_y_opt, [] { return at::Tensor(); });\n    const at::Tensor &grad_h_opt_val = c10::value_or_else(grad_h_opt, [] { return at::Tensor(); });\n    const at::Tensor &grad_c_opt_val = c10::value_or_else(grad_c_opt, [] { return at::Tensor(); });\n    auto grad_y = grad_y_opt_val.defined() ? grad_y_opt_val : at::zeros(y_output.sizes(), h.options());\n    auto grad_h = grad_h_opt_val.defined() ? grad_h_opt_val : at::zeros(h.sizes(), h_output.options());\n    auto grad_c = grad_c_opt_val.defined() ? grad_c_opt_val : at::zeros(c.sizes(), c_output.options());\n    int64_t hidden_size = y_output.size(2);\n    at::SmallVector<int64_t, SIZE> output_size = {4 * hidden_size};\n    at::Tensor grad_input = npu_preparation::apply_tensor(input);\n    at::Tensor grad_wih = npu_preparation::apply_tensor(w_ih);\n    at::Tensor grad_whh = npu_preparation::apply_tensor(w_hh);\n    at::Tensor grad_bias = npu_preparation::apply_tensor(i, output_size);\n    at::Tensor grad_ht = npu_preparation::apply_tensor(h);\n    at::Tensor grad_ct = npu_preparation::apply_tensor(c);\n    lstm_cell_backward_npu_impl_nocheck(grad_input, grad_wih, grad_whh, grad_bias, grad_ht, grad_ct, grad_y, grad_h,\n                                        grad_c, input, w_ih, w_hh, h, c, y_output, h_output, c_output, i, j, f, o,\n                                        tanhc);\n    return std::tie(grad_input, grad_wih, grad_whh, grad_bias, grad_bias, grad_ht, grad_ct);\n}\n\ntuple_tensor npu_lstm_cell(const at::Tensor &input, const at::Tensor &w_ih, const at::Tensor &w_hh, const at::Tensor &h,\n                           const at::Tensor &c, const c10::optional<at::Tensor> &b_ih_opt,\n                           const c10::optional<at::Tensor> &b_hh_opt)\n{\n    const at::Tensor &b_ih = c10::value_or_else(b_ih_opt, [] { return at::Tensor(); });\n    const at::Tensor &b_hh = c10::value_or_else(b_hh_opt, [] { return at::Tensor(); });\n    at::Tensor bias;\n    if (b_ih.defined()) {\n        bias = at::add(b_ih, b_hh).to(input.dtype());\n    }\n    return lstm_cell_npu_impl(input, w_ih, w_hh, h, c, bias);\n}\n\nstd::tuple<at::Tensor, at::Tensor> lstm_cell(const at::Tensor &input, at::TensorList hx, const at::Tensor &w_ih,\n                                             const at::Tensor &w_hh, const c10::optional<at::Tensor> &b_ih_opt,\n                                             const c10::optional<at::Tensor> &b_hh_opt)\n{\n    at::Tensor weight_ih = w_ih.t().to(input.dtype());\n    at::Tensor weight_hh = w_hh.t().to(input.dtype());\n    at::Tensor h = hx[0];\n    at::Tensor c = hx[1];\n    auto result = at_npu::native::custom_ops::npu_lstm_cell(input, weight_ih, weight_hh, h, c, b_ih_opt, b_hh_opt);\n    return std::tuple<at::Tensor, at::Tensor>(std::get<1>(result), std::get<2>(result));\n}\n} // namespace acl_op\n"
- filename: DropoutWithByteMaskKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"torch_npu/csrc/aten/CustomFunctions.h\"\n#include \"torch_npu/csrc/framework/utils/RandomOpAdapter.h\"\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_utils = at_npu::native::NpuUtils;\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_compile_type = at_npu::native::CompileType;\n\nnamespace {\nat::Tensor& dropout_do_mask_with_byte_mask(\n    at::Tensor& result,\n    const at::Tensor& self,\n    const at::Tensor& mask,\n    at::Scalar prob) {\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"DropOutDoMaskV3\")\n      .Input(self)\n      .Input(mask)\n      .Input(prob, self.scalar_type(), npu_compile_type::MEMORY_HOST_COMPILE_DEPENDENT)\n      .Output(result)\n      .Run();\n  return result;\n}\n\nat::Tensor dropout_gen_byte_mask(const at::Tensor& self, at::Scalar prob) {\n  at::IntArrayRef self_shape = self.sizes();\n  at::Tensor mask = npu_preparation::apply_tensor_with_format(\n      self_shape,\n      self.options().dtype(at::kByte),\n      ACL_FORMAT_ND);\n  at_npu::native::OpCommand cmd;\n  // If either seed or seed2 are set to be non-zero, the random number generator\n  // is seeded by the given seed. Otherwise, it is seeded by a random seed.\n  // DropOutGenMaskV3 use seed and seed2 to generator a seed, like this:\n  //  seed2   seed\n  // 127~64   63~0\n  // so, we set seed2 = 0 to ensure the seed which user set is equal to the seed\n  // used by the operator DropOutGenMaskV3\n  const auto gen = at_npu::detail::getDefaultNPUGenerator();\n  const int64_t seed = static_cast<int64_t>(gen.current_seed());\n  const int64_t seed2 = 0;\n  cmd.Name(\"DropOutGenMaskV3\")\n      .Input(self_shape)\n      .Input(prob, self.scalar_type(), npu_compile_type::MEMORY_HOST_COMPILE_DEPENDENT)\n      .Output(mask)\n      .Attr(\"seed\", seed)\n      .Attr(\"seed2\", seed2)\n      .Run();\n  return mask;\n}\n\nstd::tuple<at::Tensor, at::Tensor> dropout_out_nocheck(\n    at::Tensor result,\n    const at::Tensor& self,\n    double p) {\n  at::Tensor self_cp = npu_utils::format_contiguous(self);\n  TORCH_CHECK(\n      p >= 0 && p <= 1,\n      \"dropout probability has to be between 0 and 1, but got \", p,\n      OPS_ERROR(ErrCode::VALUE));\n  TORCH_CHECK(\n      at::isFloatingType(self_cp.scalar_type()),\n      \"dropout only supports floating-point dtypes\" + OPS_ERROR(ErrCode::TYPE));\n\n  double retain = 1. - p;\n  at::Scalar prob = at::Scalar(retain);\n  at::Tensor mask;\n  auto original_stream = c10_npu::getCurrentNPUStream();\n  {\n    // During the life cycle of this raii instance, the calcu stream is set as the\n    // secondary stream, and tasks are distributed to the secondary stream. At the\n    // same time, according to the one-stream-one-pool principle, memory is also\n    // alloced from the pool of the secondary stream.\n    c10_npu::SecondaryStreamGuard guard(c10_npu::getCurrentSecondaryStream());\n    mask = dropout_gen_byte_mask(self_cp, prob);\n  }\n  // When tasks on multiple streams read and write the same block of memory,\n  // recordStream needs to be called to ensure the correctness of memory reuse.\n  c10_npu::NPUCachingAllocator::recordStream(mask.storage().data_ptr(), original_stream);\n  dropout_do_mask_with_byte_mask(result, self_cp, mask, prob);\n\n  return std::tie(result, mask);\n}\n} // namespace\n\nat::Tensor _dropout_with_byte_mask_backward(\n    const at::Tensor& grad_output,\n    const at::Tensor& mask,\n    double scale) {\n  TORCH_CHECK(\n      at::isFloatingType(grad_output.scalar_type()),\n      \"dropoutbackward only supports floating-point dtypes\" + OPS_ERROR(ErrCode::TYPE));\n  TORCH_CHECK(\n      mask.scalar_type() == at::ScalarType::Byte,\n      \"mask should be torch.uint8 dtype\" + OPS_ERROR(ErrCode::TYPE));\n  double retain = 1. - scale;\n  at::Tensor result = npu_preparation::apply_tensor(grad_output);\n\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"DropOutDoMaskV3\")\n      .Input(grad_output)\n      .Input(mask)\n      .Input(at::Scalar(retain), grad_output.scalar_type(), npu_compile_type::MEMORY_HOST_COMPILE_DEPENDENT)\n      .Output(result)\n      .Run();\n\n  return result;\n}\n\nstd::tuple<at::Tensor, at::Tensor> _dropout_with_byte_mask(\n    const at::Tensor& self,\n    double p) {\n  at::Tensor result = npu_preparation::apply_tensor(self);\n  return dropout_out_nocheck(result, self, p);\n}\n\nat::Tensor dropout_with_byte_mask(const at::Tensor& self, double p, bool train) {\n  TORCH_CHECK(\n      torch_npu::utils::is_npu(self),\n      \"dropout_with_byte_mask only supports device for NPU!\" + OPS_ERROR(ErrCode::NOT_SUPPORT));\n  if (p == 0 || !train || self.numel() == 0) {\n    return self;\n  }\n  if (p == 1) {\n    return self.mul(at::zeros(self.sizes(), self.options()));\n  }\n  auto results = at_npu::native::custom_ops::_dropout_with_byte_mask(self, p);\n  return std::get<0>(results);\n}\n\n} // namespace acl_op\n"
- filename: BinaryCrossEntropyWithLogitsKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nat::Tensor binary_cross_entropy_with_logits_nocheck(\n    const at::Tensor& self,\n    const at::Tensor& target,\n    const at::Tensor& weight,\n    const at::Tensor& pos_weight,\n    int64_t reduction) {\n  at::IntArrayRef output_size;\n  int64_t result_format = npu_preparation::get_tensor_npu_format(self);\n\n  if (reduction == at::Reduction::None) {\n    output_size = self.sizes();\n  } else {\n    output_size = at::ArrayRef<int64_t>();\n    result_format = ACL_FORMAT_ND;\n  }\n\n  at::Tensor result = npu_preparation::apply_tensor_with_format(output_size, self.options(), result_format);\n  at::Tensor weight_tensor;\n  if (weight.defined()) {\n    weight_tensor = npu_utils::format_contiguous(weight);\n    weight_tensor = (weight.scalar_type() != self.scalar_type()) ?\n        at_npu::native::custom_ops::npu_dtype_cast(weight_tensor, self.scalar_type()) : weight_tensor;\n  } else {\n    weight_tensor = at::ones(self.sizes(), self.options());\n  }\n\n  at::Tensor pos_weight_tensor;\n  if (pos_weight.defined()) {\n    pos_weight_tensor = npu_utils::format_contiguous(pos_weight);\n    pos_weight_tensor = (pos_weight_tensor.scalar_type() != self.scalar_type()) ?\n        at_npu::native::custom_ops::npu_dtype_cast(pos_weight_tensor, self.scalar_type()) : pos_weight_tensor;\n  } else {\n    pos_weight_tensor = at::ones(self.sizes(), self.options());\n  }\n\n  std::string reduction_str = op_plugin::utils::get_reduction_str(reduction);\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"SigmoidCrossEntropyWithLogitsV2\")\n      .Input(self.to(target.dtype()))\n      .Input(target)\n      .Input(weight_tensor)\n      .Input(pos_weight_tensor)\n      .Output(result)\n      .Attr(\"reduction\", reduction_str)\n      .Run();\n\n  return result;\n}\n} // namespace\n\nat::Tensor npu_binary_cross_entropy_with_logits_backward(\n    const at::Tensor& grad_output,\n    const at::Tensor& self,\n    const at::Tensor& target,\n    const c10::optional<at::Tensor>& weight_opt,\n    const c10::optional<at::Tensor>& pos_weight_opt,\n    int64_t reduction) {\n  at::Tensor grad_input = npu_preparation::apply_tensor(self);\n  const at::Tensor& weight = c10::value_or_else(weight_opt, [] {return at::Tensor();});\n  const at::Tensor& pos_weight = c10::value_or_else(pos_weight_opt, [] {return at::Tensor();});\n  at::Tensor weight_tensor;\n  if (weight.defined()) {\n    weight_tensor = npu_utils::format_contiguous(weight);\n    weight_tensor = (weight_tensor.scalar_type() != self.scalar_type()) ?\n        at_npu::native::custom_ops::npu_dtype_cast(weight_tensor, self.scalar_type()) : weight_tensor;\n  } else {\n    weight_tensor = at::ones(self.sizes(), self.options());\n  }\n\n  at::Tensor pos_weight_tensor;\n  if (pos_weight.defined()) {\n    pos_weight_tensor = npu_utils::format_contiguous(pos_weight);\n    pos_weight_tensor = (pos_weight_tensor.scalar_type() != self.scalar_type()) ?\n        at_npu::native::custom_ops::npu_dtype_cast(pos_weight_tensor, self.scalar_type()) : pos_weight_tensor;\n  } else {\n    pos_weight_tensor = at::ones(self.sizes(), self.options());\n  }\n\n  at::Tensor dout_tensor = acl_op::npu_broadcast(grad_output, self.sizes());\n  std::string reduction_str = op_plugin::utils::get_reduction_str(reduction);\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"SigmoidCrossEntropyWithLogitsGradV2\")\n      .Input(self)\n      .Input(target)\n      .Input(dout_tensor)\n      .Input(weight_tensor)\n      .Input(pos_weight_tensor)\n      .Output(grad_input)\n      .Attr(\"reduction\", reduction_str)\n      .Run();\n\n  return grad_input;\n}\n\nat::Tensor binary_cross_entropy_with_logits(\n    const at::Tensor& self,\n    const at::Tensor& target,\n    const c10::optional<at::Tensor>& weight_opt,\n    const c10::optional<at::Tensor>& pos_weight_opt,\n    int64_t reduction) {\n  const at::Tensor& weight = c10::value_or_else(weight_opt, [] {return at::Tensor();});\n  const at::Tensor& pos_weight = c10::value_or_else(pos_weight_opt, [] {return at::Tensor();});\n  return binary_cross_entropy_with_logits_nocheck(self, target, weight, pos_weight, reduction);\n}\n} // namespace acl_op\n"
- filename: MaskedFillKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_utils = at_npu::native::NpuUtils;\nusing npu_preparation = at_npu::native::OpPreparation;\n\nnamespace {\nat::Tensor& masked_fill_out_npu_nocheck(at::Tensor& result, const at::Tensor& self, const at::Tensor& mask, const at::Tensor& value) {\n  at::Tensor mask_bool = mask;\n  int64_t dim_of_self = self.dim();\n  /* Avoid the problem that the TBE operator does not support 0-dimensional tensor input */\n  if (dim_of_self == 0) {\n    self.unsqueeze_(0);\n  }\n\n  if ((mask.dtype() != at::kBool)) {\n    mask_bool = at_npu::native::custom_ops::npu_dtype_cast(mask, at::kBool);\n  }\n  at::Tensor value_tensor = value;\n  if (value.dtype() != self.dtype()) {\n    value_tensor = value_tensor.to(self.dtype());\n  }\n\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"MaskedFill\")\n      .Input(self)\n      .Input(mask_bool)\n      .Input(value_tensor)\n      .Output(result)\n      .Run();\n\n  if (dim_of_self == 0) {\n    result.squeeze_(0);\n  }\n  return result;\n}\n\nat::Tensor& masked_fill_out_npu_nocheck(at::Tensor& result, const at::Tensor& self, const at::Tensor& mask, at::Scalar value) {\n  at::Tensor mask_bool = mask;\n  int64_t dim_of_self = self.dim();\n  /* Avoid the problem that the TBE operator does not support 0-dimensional tensor input */\n  if (dim_of_self == 0) {\n    self.unsqueeze_(0);\n  }\n\n  if (!(mask.dtype() == at::kBool)) {\n    mask_bool = at_npu::native::custom_ops::npu_dtype_cast(mask, at::kBool);\n  }\n\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"MaskedFill\")\n      .Input(self)\n      .Input(mask_bool)\n      .Input(value, self.scalar_type())\n      .Output(result)\n      .Run();\n    \n  if (dim_of_self == 0) {\n    result.squeeze_(0);\n  }\n  return result;\n}\n} // namespace\n\nat::Tensor& masked_fill_(at::Tensor& self, const at::Tensor& mask, const at::Tensor& value) {\n  if (npu_preparation::IsCPUScalar(value)) {\n    return acl_op::masked_fill_(self, mask, value.item());\n  }\n\n  if (!npu_utils::check_match(&self)) {\n    at::Tensor contiguous_self = npu_utils::format_contiguous(self);\n    masked_fill_out_npu_nocheck(contiguous_self, contiguous_self, mask, value);\n    npu_utils::format_fresh_view(self, contiguous_self);\n  } else {\n    masked_fill_out_npu_nocheck(self, self, mask, value);\n  }\n  return self;\n}\n\nat::Tensor& masked_fill_(at::Tensor& self, const at::Tensor& mask, const at::Scalar& value) {\n  if (!npu_utils::check_match(&self)) {\n    at::Tensor contiguous_self = npu_utils::format_contiguous(self);\n    masked_fill_out_npu_nocheck(contiguous_self, contiguous_self, mask, value);\n    npu_utils::format_fresh_view(self, contiguous_self);\n  } else {\n    masked_fill_out_npu_nocheck(self, self, mask, value);\n  }\n\n  return self;\n}\n} // namespace acl_op\n"