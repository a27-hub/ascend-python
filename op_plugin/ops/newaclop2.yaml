- filename: AvgPool3dBackwardKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include <ATen/native/Pool.h>\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nvoid avg_pool3d_backward_out_nocheck(at::Tensor &grad_output, const at::Tensor &grad_input, const at::Tensor &self,\n                                     at::IntArrayRef kernel_sizess, at::IntArrayRef stridess, at::IntArrayRef paddingss,\n                                     bool ceil_mode, bool count_include_pad, c10::optional<int64_t> divisor_override)\n{\n    at::Tensor input = self;\n    at::Tensor grads = grad_input.contiguous();\n\n    grad_output.resize_as_(input);\n    grad_output.zero_();\n    if (self.ndimension() == 4) {\n        input = input.unsqueeze(0);\n        grads = grads.unsqueeze(0);\n        grad_output = grad_output.unsqueeze(0);\n    }\n\n    TORCH_CHECK(paddingss.size() >= 3, \"padding length shoud be at least 3, but got: \", paddingss.size(),\n        OPS_ERROR(ErrCode::PARAM));\n    c10::SmallVector<int64_t, N> dim_list(input.sizes());\n    c10::SmallVector<int64_t, N> pads = {paddingss[0], paddingss[0], paddingss[1],\n                                         paddingss[1], paddingss[2], paddingss[2]};\n\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"AvgPool3DGrad\")\n        .Input(dim_list)\n        .Input(grads, \"grads\")\n        .Output(grad_output, \"output\")\n        .Attr(\"ksize\", kernel_sizess)\n        .Attr(\"strides\", stridess)\n        .Attr(\"pads\", pads)\n        .Attr(\"ceil_mode\", ceil_mode)\n        .Attr(\"count_include_pad\", count_include_pad);\n\n    if (divisor_override.has_value()) {\n        cmd.Attr(\"divisor_override\", divisor_override.value());\n    }\n\n    cmd.Attr(\"data_format\", (string) \"NCDHW\").Run();\n\n    if (self.ndimension() == 4) {\n        grad_output = grad_output.squeeze(0);\n    }\n}\nvoid avg_pool3d_backward_parameter_check(const at::Tensor &self, at::IntArrayRef kernel_size, at::IntArrayRef stride,\n                                         at::IntArrayRef padding, c10::optional<int64_t> divisor_override)\n{\n    TORCH_CHECK(kernel_size.size() == 1 || kernel_size.size() == 3,\n        \"avg_pool3d_backward: kernel_size must be a single int, or a tuple of three ints\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(stride.empty() || stride.size() == 1 || stride.size() == 3,\n        \"avg_pool3d_backward: stride must be omitted, a single int, or a tuple of three ints\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(padding.size() == 1 || padding.size() == 3,\n        \"avg_pool3d_backward: padding must be a single int, or a tuple of three ints\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK((self.ndimension() == 4 || self.ndimension() == 5),\n        \"non-empty 4D or 5D (batch mode) tensor expected for input\"\n        + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(!divisor_override.has_value() || divisor_override.value() != 0,\n        \"avg_pool3d_backward divisor must be not zero\" + OPS_ERROR(ErrCode::PARAM));\n}\n} // namespace\n\nat::Tensor &avg_pool3d_backward_out(const at::Tensor &grad_input, const at::Tensor &self, at::IntArrayRef kernel_size,\n                                    at::IntArrayRef stride, at::IntArrayRef padding, bool ceil_mode,\n                                    bool count_include_pad, c10::optional<int64_t> divisor_override,\n                                    at::Tensor &grad_output)\n{\n    avg_pool3d_backward_parameter_check(self, kernel_size, stride, padding, divisor_override);\n\n    const int k_T = at::native::safe_downcast<int, int64_t>(kernel_size[0]);\n    const int k_H = kernel_size.size() == 1 ? k_T : at::native::safe_downcast<int, int64_t>(kernel_size[1]);\n    const int k_W = kernel_size.size() == 1 ? k_T : at::native::safe_downcast<int, int64_t>(kernel_size[2]);\n    c10::SmallVector<int64_t, SIZE> kernel_sizes = {1, 1, k_T, k_H, k_W};\n    at::IntArrayRef kernel_sizess = at::IntArrayRef(kernel_sizes);\n\n    const int d_T = stride.empty() ? k_T : at::native::safe_downcast<int, int64_t>(stride[0]);\n    const int d_H = stride.empty()     ? k_H :\n                    stride.size() == 1 ? d_T :\n                                         at::native::safe_downcast<int, int64_t>(stride[1]);\n    const int d_W = stride.empty()     ? k_W :\n                    stride.size() == 1 ? d_T :\n                                         at::native::safe_downcast<int, int64_t>(stride[2]);\n    c10::SmallVector<int64_t, SIZE> strides = {1, 1, d_T, d_H, d_W};\n    at::IntArrayRef stridess = at::IntArrayRef(strides);\n\n    const int pad_T = at::native::safe_downcast<int, int64_t>(padding[0]);\n    const int pad_H = padding.size() == 1 ? pad_T : at::native::safe_downcast<int, int64_t>(padding[1]);\n    const int pad_W = padding.size() == 1 ? pad_T : at::native::safe_downcast<int, int64_t>(padding[2]);\n    c10::SmallVector<int64_t, SIZE> paddings = {pad_H, pad_W, pad_T};\n    at::IntArrayRef paddingss = at::IntArrayRef(paddings);\n\n    const int64_t nslices = self.size(-4);\n    const int64_t itime = self.size(-3);\n    const int64_t iheight = self.size(-2);\n    const int64_t iwidth = self.size(-1);\n    const int64_t otime = grad_input.size(-3);\n    const int64_t oheight = grad_input.size(-2);\n    const int64_t owidth = grad_input.size(-1);\n\n    /* XXX shape check behavior from TH */\n    const int64_t otime_for_shape_check =\n        at::native::pooling_output_shape<int64_t>(itime, k_T, pad_T, d_T, 1, ceil_mode);\n    const int64_t oheight_for_shape_check =\n        at::native::pooling_output_shape<int64_t>(iheight, k_H, pad_H, d_H, 1, ceil_mode);\n    const int64_t owidth_for_shape_check =\n        at::native::pooling_output_shape<int64_t>(iwidth, k_W, pad_W, d_W, 1, ceil_mode);\n\n    at::native::avg_pool3d_backward_shape_check(\n        self, grad_input, nslices, k_T, k_H, k_W, d_T, d_H, d_W, pad_T, pad_H, pad_W, itime, iheight, iwidth,\n        otime_for_shape_check, oheight_for_shape_check, owidth_for_shape_check, \"avg_pool3d_backward_out()\");\n\n    npu_preparation::CheckOut({grad_input, self}, grad_output, ACL_FORMAT_NCDHW, self.scalar_type(), self.sizes());\n    if (!npu_utils::check_match(&grad_output)) {\n        at::Tensor contig_grad_output = npu_utils::format_contiguous(grad_output);\n        avg_pool3d_backward_out_nocheck(contig_grad_output, grad_input, self, kernel_sizess, stridess, paddingss,\n                                        ceil_mode, count_include_pad, divisor_override);\n        npu_utils::format_fresh_view(grad_output, contig_grad_output);\n    } else {\n        avg_pool3d_backward_out_nocheck(grad_output, grad_input, self, kernel_sizess, stridess, paddingss, ceil_mode,\n                                        count_include_pad, divisor_override);\n    }\n\n    return grad_output;\n}\n\nat::Tensor avg_pool3d_backward(const at::Tensor &grad_output, const at::Tensor &self, at::IntArrayRef kernel_size,\n                               at::IntArrayRef stride, at::IntArrayRef padding, bool ceil_mode, bool count_include_pad,\n                               c10::optional<int64_t> divisor_override)\n{\n    at::Tensor input = self;\n    at::Tensor grad_input = grad_output;\n    if (self.ndimension() == 4) {\n        input = self.unsqueeze(0);\n        grad_input = grad_input.unsqueeze(0);\n    }\n    avg_pool3d_backward_parameter_check(input, kernel_size, stride, padding, divisor_override);\n\n    const int k_T = at::native::safe_downcast<int, int64_t>(kernel_size[0]);\n    const int k_H = kernel_size.size() == 1 ? k_T : at::native::safe_downcast<int, int64_t>(kernel_size[1]);\n    const int k_W = kernel_size.size() == 1 ? k_T : at::native::safe_downcast<int, int64_t>(kernel_size[2]);\n    c10::SmallVector<int64_t, SIZE> kernel_sizes = {1, 1, k_T, k_H, k_W};\n    at::IntArrayRef kernel_sizess = at::IntArrayRef(kernel_sizes);\n\n    const int d_T = stride.empty() ? k_T : at::native::safe_downcast<int, int64_t>(stride[0]);\n    const int d_H = stride.empty()     ? k_H :\n                    stride.size() == 1 ? d_T :\n                                         at::native::safe_downcast<int, int64_t>(stride[1]);\n    const int d_W = stride.empty()     ? k_W :\n                    stride.size() == 1 ? d_T :\n                                         at::native::safe_downcast<int, int64_t>(stride[2]);\n    c10::SmallVector<int64_t, SIZE> strides = {1, 1, d_T, d_H, d_W};\n    at::IntArrayRef stridess = at::IntArrayRef(strides);\n\n    const int pad_T = at::native::safe_downcast<int, int64_t>(padding[0]);\n    const int pad_H = padding.size() == 1 ? pad_T : at::native::safe_downcast<int, int64_t>(padding[1]);\n    const int pad_W = padding.size() == 1 ? pad_T : at::native::safe_downcast<int, int64_t>(padding[2]);\n    c10::SmallVector<int64_t, SIZE> paddings = {pad_H, pad_W, pad_T};\n    at::IntArrayRef paddingss = at::IntArrayRef(paddings);\n\n    const int64_t nslices = input.size(-4);\n    const int64_t itime = input.size(-3);\n    const int64_t iheight = input.size(-2);\n    const int64_t iwidth = input.size(-1);\n    const int64_t otime = grad_input.size(-3);\n    const int64_t oheight = grad_input.size(-2);\n    const int64_t owidth = grad_input.size(-1);\n\n    /* XXX shape check behavior from TH */\n    const int64_t otime_for_shape_check =\n        at::native::pooling_output_shape<int64_t>(itime, k_T, pad_T, d_T, 1, ceil_mode);\n    const int64_t oheight_for_shape_check =\n        at::native::pooling_output_shape<int64_t>(iheight, k_H, pad_H, d_H, 1, ceil_mode);\n    const int64_t owidth_for_shape_check =\n        at::native::pooling_output_shape<int64_t>(iwidth, k_W, pad_W, d_W, 1, ceil_mode);\n\n    at::native::avg_pool3d_backward_shape_check(\n        input, grad_input, nslices, k_T, k_H, k_W, d_T, d_H, d_W, pad_T, pad_H, pad_W, itime, iheight, iwidth,\n        otime_for_shape_check, oheight_for_shape_check, owidth_for_shape_check, \"avg_pool3d_backward_out()\");\n\n    at::Tensor output = npu_preparation::apply_tensor_with_format(input, ACL_FORMAT_NCDHW);\n    avg_pool3d_backward_out_nocheck(output, grad_input, input, kernel_sizess, stridess, paddingss, ceil_mode,\n                                    count_include_pad, divisor_override);\n\n    if (input.ndimension() == 4) {\n        output = output.squeeze(0);\n    }\n\n    return output;\n}\n\n} // namespace acl_op\n"
- filename: ArgmaxKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_compile_type = at_npu::native::CompileType;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nat::Tensor& argmax_out_nocheck(at::Tensor& result, const at::Tensor& input, at::Scalar& dim_scalar, bool keepdim_value)\n{\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"ArgMaxV2\")\n        .Input(input)\n        .Input(dim_scalar, at::kInt, npu_compile_type::MEMORY_HOST_COMPILE_DEPENDENT)\n        .Output(result)\n        .Attr(\"keep_dims\", keepdim_value)\n        .Run();\n    return result;\n}\n}\n\nat::Tensor argmax(const at::Tensor& self, at::optional<int64_t> dim, bool keepdim)\n{\n    at::Tensor input = dim.has_value() ? self : self.reshape({-1});\n    int64_t dim_value = dim.has_value() ? dim.value() : 0;\n    bool keepdim_value = dim.has_value() ? keepdim : false;\n    auto output_size = op_infer::reduce_ops_npu_output_size(input, dim_value, keepdim_value);\n    at::Tensor result = npu_preparation::ApplyTensorWithSizes(output_size, self.options().dtype(at::kInt));\n    at::Scalar dim_scalar = dim_value;\n    argmax_out_nocheck(result, input, dim_scalar, keepdim_value);\n    result = at_npu::native::custom_ops::npu_dtype_cast(result, at::kLong);\n    return result;\n}\n\nat::Tensor& argmax_out(const at::Tensor& self, at::optional<int64_t> dim, bool keepdim, at::Tensor& result)\n{\n    at::Tensor input = dim.has_value() ? self : self.reshape({-1});\n    int64_t dim_value = dim.has_value() ? dim.value() : 0;\n    bool keepdim_value = dim.has_value() ? keepdim : false;\n    auto output_size = op_infer::reduce_ops_npu_output_size(input, dim_value, keepdim_value);\n    npu_preparation::CheckOut(\n        {self},\n        result,\n        npu_preparation::get_tensor_npu_format(result),\n        at::kLong,\n        output_size);\n    at::Scalar dim_scalar = dim_value;\n    at::Tensor result_cast = at_npu::native::custom_ops::npu_dtype_cast(result, at::kInt);\n    argmax_out_nocheck(result_cast, input, dim_scalar, keepdim_value);\n    if (!npu_utils::check_match(&result)) {\n        at::Tensor contiguous_result = at_npu::native::custom_ops::npu_dtype_cast(result_cast, at::kLong);\n        npu_utils::format_fresh_view(result, contiguous_result);\n    } else {\n        result = at_npu::native::custom_ops::npu_dtype_cast(result_cast, at::kLong);\n    }\n    return result;\n}\n\n} // namespace acl_op\n"
- filename: UpSampleNearest3dKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nat::SmallVector<int64_t, SIZE> upsample_nearest3d_infer_size(const at::Tensor &input, at::IntArrayRef output_size,\n                                                             c10::optional<double> scales_d,\n                                                             c10::optional<double> scales_h,\n                                                             c10::optional<double> scales_w)\n{\n    TORCH_CHECK(input.dim() == 5, \"The input should be 5D, but got \", input.dim(), \"D\" + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(output_size.size() == 3, \"The length of output_size should be equal to 3, but got \",\n                output_size.size(), OPS_ERROR(ErrCode::PARAM));\n\n    int64_t output_depth = output_size[0];\n    int64_t output_height = output_size[1];\n    int64_t output_width = output_size[2];\n\n    int64_t nbatch = input.size(0);\n    int64_t channels = input.size(1);\n\n    at::SmallVector<int64_t, SIZE> output_sizes = {nbatch, channels, output_depth, output_height, output_width};\n\n    return output_sizes;\n}\n\nat::Tensor &upsample_nearest3d_out_nocheck(at::Tensor &result, const at::Tensor &input, at::IntArrayRef output_size,\n                                           c10::optional<double> scales_d, c10::optional<double> scales_h,\n                                           c10::optional<double> scales_w)\n{\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"UpsampleNearest3d\").Input(input).Output(result).Attr(\"output_size\", output_size).Run();\n\n    return result;\n}\n} // namespace\n\nat::Tensor &upsample_nearest3d_out(const at::Tensor &input, at::IntArrayRef output_size, c10::optional<double> scales_d,\n                                   c10::optional<double> scales_h, c10::optional<double> scales_w, at::Tensor &result)\n{\n    auto op_infer_output_size = upsample_nearest3d_infer_size(input, output_size, scales_d, scales_h, scales_w);\n    npu_preparation::CheckOut({input}, result, input, op_infer_output_size);\n\n    if (!npu_utils::check_match(&result)) {\n        at::Tensor contiguous_result = npu_utils::format_contiguous(result);\n        upsample_nearest3d_out_nocheck(contiguous_result, input, output_size, scales_d, scales_h, scales_w);\n        npu_utils::format_fresh_view(result, contiguous_result);\n    } else {\n        upsample_nearest3d_out_nocheck(result, input, output_size, scales_d, scales_h, scales_w);\n    }\n    return result;\n}\n\nat::Tensor upsample_nearest3d(const at::Tensor &input, at::IntArrayRef output_size, c10::optional<double> scales_d,\n                              c10::optional<double> scales_h, c10::optional<double> scales_w)\n{\n    auto op_infer_output_size = upsample_nearest3d_infer_size(input, output_size, scales_d, scales_h, scales_w);\n    at::Tensor result = npu_preparation::apply_tensor(input, op_infer_output_size);\n    upsample_nearest3d_out_nocheck(result, input, output_size, scales_d, scales_h, scales_w);\n    return result;\n}\n\n#ifdef VERSION_V1R11\nat::Tensor upsample_nearest3d(\n    const at::Tensor& input,\n    c10::optional<at::IntArrayRef> output_size,\n    c10::optional<at::ArrayRef<double>> scale_factors) {\n    TORCH_CHECK(\n        input.dim() == 5,\n        \"It is expected input_size equals to 5, but got size \",\n        input.dim(), OPS_ERROR(ErrCode::PARAM));\n\n  auto osize = op_infer::upsample_infershape_with_scale(input.sizes(), output_size, scale_factors);\n  auto scales_d = op_plugin::utils::get_scale_value(scale_factors, 0);\n  auto scales_h = op_plugin::utils::get_scale_value(scale_factors, 1);\n  auto scales_w = op_plugin::utils::get_scale_value(scale_factors, 2);\n\n  return acl_op::upsample_nearest3d(input, osize, scales_d, scales_h, scales_w);\n}\n#endif\n} // namespace acl_op\n"
- filename: PackPaddedSequenceKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/OpInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nstd::tuple<at::Tensor, at::Tensor> _pack_padded_sequence(const at::Tensor &input, const at::Tensor &lengths,\n                                                         bool batch_first)\n{\n    TORCH_CHECK(input.dim() >= 2, \"Input must have two dims.\", input.dim(), OPS_ERROR(ErrCode::PARAM));\n    // get the size of B and T, the input size is [T, B, *] or [B, T, *]\n    auto batchsize = batch_first ? input.size(0) : input.size(1);\n    auto timesize = batch_first ? input.size(1) : input.size(0);\n\n    TORCH_CHECK(input.numel() > 0, \"Cannot pack empty tensors.\" + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(input.numel() < std::numeric_limits<int64_t>::max(),\n                \"Input tensor contain more than the max number of int64.\" + OPS_ERROR(ErrCode::PARAM));\n\n    TORCH_CHECK(lengths.size(0) == batchsize, \"Expected 'len(lengths)' to be equal to batch_size, but got \",\n                lengths.size(0), \" (batch_size=\", batchsize, \")\" + OPS_ERROR(ErrCode::PARAM));\n\n    auto lengths_vec = lengths.contiguous().data_ptr<int64_t>();\n    TORCH_CHECK(lengths_vec != nullptr && lengths_vec[batchsize - 1] > 0,\n                \"Length of all samples has to be greater than 0, but found an element \"\n                \"in 'lengths' that is <= 0\" + OPS_ERROR(ErrCode::PARAM));\n\n    // According to the TMG decision, adaptation avoidance scheme I\n    // is temporarily adopted to retain the filling within effective T0,\n    // [B*T0, *]\n    auto output = batch_first ? input.transpose(0, 1) : input;\n    auto len = lengths_vec[0];\n    if (len < timesize) {\n        vector<int> tmp_vector = {};\n        for (int i = 0; i < len; i++) {\n            tmp_vector.emplace_back(i);\n        }\n        auto index = at::from_blob(tmp_vector.data(), {len}, at::kInt);\n        index = npu_preparation::copy_tensor_host_to_device(index);\n        output = op_plugin::index_select(output, 0, index);\n        timesize = len;\n    }\n\n    at::SmallVector<int64_t, N> shape;\n    shape.emplace_back(batchsize * timesize);\n    for (int i = 2; i < input.dim(); i++) {\n        shape.emplace_back(input.size(i));\n    }\n\n    output = output.contiguous();\n    output = output.reshape(shape);\n\n    at::Tensor batchsizes = at::empty({timesize}, lengths.options());\n    auto batchsize_vec = batchsizes.data_ptr<int64_t>();\n    TORCH_CHECK(batchsize_vec != nullptr, \"batchsizes is null\" + OPS_ERROR(ErrCode::PARAM));\n    int64_t last = batchsize - 1;\n    for (int ti = 0; ti < timesize; ti++) {\n        for (int bi = last; bi >= 0; bi--) {\n            if (lengths_vec[bi] > ti) {\n                batchsize_vec[ti] = (bi + 1);\n                last = bi;\n                break;\n            }\n        }\n    }\n    return std::tie(output, batchsizes);\n}\n} // namespace acl_op\n"
- filename: CtcLossKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nstd::tuple<at::Tensor, at::Tensor> _ctc_loss(const at::Tensor &log_probs, const at::Tensor &targets,\n                                             at::IntArrayRef input_lengths_list, at::IntArrayRef target_lengths_list,\n                                             int64_t blank, bool zero_infinity)\n{\n    TORCH_CHECK(log_probs.dim() == 3, \"log_probs has to be a 3D Tensor, but got Tensor of dimension \", log_probs.dim(),\n        OPS_ERROR(ErrCode::PARAM));\n    at::Tensor log_probs_cast = log_probs;\n    if (log_probs.scalar_type() == at::kHalf) {\n        log_probs_cast = at_npu::native::custom_ops::npu_dtype_cast(log_probs_cast, at::kFloat);\n    }\n\n    auto input_lengths_tensor = at::tensor(input_lengths_list, targets.options());\n    auto target_lengths_tensor = at::tensor(target_lengths_list, targets.options());\n\n    int64_t max_length = 0;\n    for (auto &i : target_lengths_list) {\n        if (i > max_length) {\n            max_length = i;\n        }\n    }\n    // add max_length info\n    auto shape = log_probs.sizes();\n    blank = blank + max_length * shape[2];\n\n    auto output_sizes = op_infer::ctc_loss_npu_output_size(log_probs, max_length);\n    at::Tensor neg_log_likelihood = npu_preparation::apply_tensor_with_format(\n        std::get<0>(output_sizes), log_probs_cast.options(), npu_preparation::get_tensor_npu_format(log_probs_cast));\n\n    at::Tensor log_alpha = npu_preparation::apply_tensor_with_format(\n        std::get<1>(output_sizes), log_probs_cast.options(), npu_preparation::get_tensor_npu_format(log_probs_cast));\n\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"CTCLossV2\")\n        .Input(log_probs_cast)\n        .Input(targets)\n        .Input(input_lengths_tensor)\n        .Input(target_lengths_tensor)\n        .Output(neg_log_likelihood)\n        .Output(log_alpha)\n        .Attr(\"blank\", blank)\n        .Attr(\"zero_infinity\", zero_infinity)\n        .Run();\n\n    if (log_probs.scalar_type() == at::kHalf) {\n        neg_log_likelihood = at_npu::native::custom_ops::npu_dtype_cast(neg_log_likelihood, at::kHalf);\n        log_alpha = at_npu::native::custom_ops::npu_dtype_cast(log_alpha, at::kHalf);\n    }\n\n    return std::tie(neg_log_likelihood, log_alpha);\n}\n\nat::Tensor ctc_loss(const at::Tensor &log_probs, const at::Tensor &targets, at::IntArrayRef input_lengths_list,\n                    at::IntArrayRef target_lengths_list, int64_t blank, int64_t reduction, bool zero_infinity)\n{\n    // Implementation of synchronous logic reference CUDA.\n    auto executed_targets = targets;\n    if (targets.device() != log_probs.device()) {\n        executed_targets = targets.to(log_probs.device());\n    }\n    at::Tensor res = std::get<0>(\n        at::_ctc_loss(log_probs, executed_targets, input_lengths_list, target_lengths_list, blank, zero_infinity));\n\n    if (zero_infinity) {\n        res = at::where(res == at::Scalar(std::numeric_limits<double>::infinity()), at::zeros({}, res.options()), res);\n    }\n\n    if (reduction == at::Reduction::Mean) {\n        std::vector<int64_t> target_lengths_vector = target_lengths_list.vec();\n        auto target_lengths_tensor =\n            npu_preparation::copy_tensor_host_to_device(\n                at::from_blob(target_lengths_vector.data(), {target_lengths_vector.size()}, at::kLong))\n                .clamp_min(1);\n        at::Tensor target_lengths_tensor_ = target_lengths_tensor.to(res.dtype());\n        return res.div(target_lengths_tensor_).mean();\n    } else if (reduction == at::Reduction::Sum) {\n        return res.sum();\n    }\n\n    return res;\n}\n\nat::Tensor ctc_loss(const at::Tensor &log_probs, const at::Tensor &targets, const at::Tensor &input_lengths,\n                    const at::Tensor &target_lengths, int64_t blank, int64_t reduction, bool zero_infinity)\n{\n    TORCH_CHECK(isIntegralType(input_lengths.scalar_type(), false), \"input_lengths must be integral\"\n        + OPS_ERROR(ErrCode::TYPE));\n    TORCH_CHECK(isIntegralType(target_lengths.scalar_type(), false), \"target_lengths must be integral\"\n        + OPS_ERROR(ErrCode::TYPE));\n\n    at::Tensor input_lengths_tensor = input_lengths.to(at::Device(at::kCPU), at::kLong).contiguous();\n    at::Tensor target_lengths_tensor = target_lengths.to(at::Device(at::kCPU), at::kLong).contiguous();\n\n    auto input_length_ptr = input_lengths_tensor.data_ptr<int64_t>();\n    auto target_length_ptr = target_lengths_tensor.data_ptr<int64_t>();\n    TORCH_CHECK(input_length_ptr != nullptr, \"input_lengths is null\" + OPS_ERROR(ErrCode::PARAM));\n    TORCH_CHECK(target_length_ptr != nullptr, \"target_lengths is null\" + OPS_ERROR(ErrCode::PARAM));\n    at::IntArrayRef input_lengths_list(input_length_ptr, input_lengths_tensor.numel());\n    at::IntArrayRef target_lengths_list(target_length_ptr, target_lengths_tensor.numel());\n\n    return at::ctc_loss(log_probs, targets, input_lengths_list, target_lengths_list, blank, reduction, zero_infinity);\n}\n} // namespace acl_op\n"
- filename: LayerNormBackwardKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing tensor_list = std::tuple<at::Tensor &, at::Tensor &, at::Tensor &>;\nusing tensor_list3 = std::tuple<at::Tensor, at::Tensor, at::Tensor>;\n\nnamespace {\ntensor_list layer_norm_backward_nocheck(at::Tensor &d_x, at::Tensor &dgamma, at::Tensor &dbeta, const at::Tensor &d_y,\n                                        const at::Tensor &X, const at::Tensor &mean, const at::Tensor &variance,\n                                        const at::Tensor &gamma, int64_t M, int64_t N)\n{\n    at::SmallVector<int64_t, SIZE> tmp_size = op_infer::array_to_small_vector(X.sizes());\n    for (int i = X.dim() - gamma.dim(); i < X.dim(); i++) {\n        tmp_size[i] = 1;\n    }\n    at::Tensor mean_ex = mean.reshape(tmp_size);\n    at::Tensor variance_ex = variance.reshape(tmp_size);\n    double eps = 1e-05;\n\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"LayerNormGrad\")\n        .Input(d_y)\n        .Input(X)\n        .Input(variance_ex)\n        .Input(mean_ex)\n        .Input(gamma)\n        .Output(d_x)\n        .Output(dgamma)\n        .Output(dbeta)\n        .Run();\n    return std::tuple<at::Tensor &, at::Tensor &, at::Tensor &>(d_x, dgamma, dbeta);\n}\n\ntensor_list3 layer_norm_backward_npu_support(const at::Tensor &d_y, const at::Tensor &X, const at::Tensor &mean,\n                                             const at::Tensor &variance, const c10::optional<at::Tensor> &gamma_ex,\n                                             int64_t M, int64_t N, std::array<bool, 3> output_mask)\n{\n    const at::Tensor &gamma = c10::value_or_else(gamma_ex, [] { return at::Tensor(); });\n    at::Tensor d_x;\n    at::Tensor dgamma;\n    at::Tensor dbeta;\n    at::Tensor gamma_temp = gamma;\n\n    at::SmallVector<int64_t, 8> tmp_size;\n    int64_t numels = 1;\n    for (int64_t i = X.dim() - 1; i >= 0; i--) {\n        numels *= X.size(i);\n        tmp_size.emplace_back(X.size(i));\n        if (numels == N) {\n            break;\n        }\n    }\n    std::reverse(tmp_size.begin(), tmp_size.end());\n    if (!gamma.defined()) {\n        gamma_temp = at::ones(tmp_size, X.options());\n    } else if (!gamma.sizes().equals(tmp_size)) {\n        gamma_temp.resize_(tmp_size);\n    }\n\n    auto output_sizes = op_infer::layer_norm_backward_npu_output_size(d_y, X, mean, variance, gamma_temp, M, N);\n\n    if (M <= 0) {\n        d_x = at::native::empty_like(X, c10::nullopt /* dtype */, c10::nullopt /* layout */, c10::nullopt /* device */,\n                                     c10::nullopt /* pin_memory */, LEGACY_CONTIGUOUS_MEMORY_FORMAT);\n        dgamma = at::native::zeros_like(gamma_temp, c10::nullopt /* dtype */, c10::nullopt /* layout */,\n                                        c10::nullopt /* device */, c10::nullopt /* pin_memory */,\n                                        LEGACY_CONTIGUOUS_MEMORY_FORMAT);\n        dbeta = at::native::zeros_like(gamma_temp, c10::nullopt /* dtype */, c10::nullopt /* layout */,\n                                       c10::nullopt /* device */, c10::nullopt /* pin_memory */,\n                                       LEGACY_CONTIGUOUS_MEMORY_FORMAT);\n        return std::make_tuple(std::move(d_x), std::move(dgamma), std::move(dbeta));\n    }\n\n    d_x = npu_preparation::apply_tensor(X, std::get<0>(output_sizes));\n    dgamma = npu_preparation::apply_tensor(gamma_temp, std::get<1>(output_sizes));\n    dbeta = npu_preparation::apply_tensor(gamma_temp, std::get<2>(output_sizes));\n\n    return layer_norm_backward_nocheck(d_x, dgamma, dbeta, d_y, X, mean, variance, gamma_temp, M, N);\n}\n} // namespace\n\ntensor_list3 native_layer_norm_backward(const at::Tensor &d_y, const at::Tensor &X, at::IntArrayRef normalized_shape,\n                                        const at::Tensor &mean, const at::Tensor &variance,\n                                        const c10::optional<at::Tensor> &gamma, const c10::optional<at::Tensor> &beta,\n                                        std::array<bool, 3> output_mask)\n{\n    const int normalized_ndim = static_cast<int>(normalized_shape.size());\n    const auto input_shape = X.sizes();\n    const auto input_ndim = X.dim();\n\n    TORCH_CHECK(\n        (input_ndim >= normalized_ndim && input_shape.slice(input_ndim - normalized_ndim).equals(normalized_shape)),\n        \"Given normalized_shape=\", normalized_shape, \", expected input with shape [*\",\n        op_infer::array_to_small_vector(normalized_shape), \"], but got input of size\", input_shape,\n        OPS_ERROR(ErrCode::PARAM));\n\n    const int axis = input_ndim - normalized_ndim;\n    const int64_t M =\n        std::accumulate(input_shape.cbegin(), input_shape.cbegin() + axis, 1LL, std::multiplies<int64_t>());\n    const int64_t N = std::accumulate(input_shape.cbegin() + axis, input_shape.cend(), 1LL, std::multiplies<int64_t>());\n    return layer_norm_backward_npu_support(d_y, X, mean, variance, gamma, M, N, output_mask);\n}\n\ntensor_list3 npu_layernorm_grad(const at::Tensor &d_y, const at::Tensor &X, at::IntArrayRef normalized_shape,\n                                const at::Tensor &mean, const at::Tensor &variance,\n                                const c10::optional<at::Tensor> &gamma, const c10::optional<at::Tensor> &beta)\n{\n    std::array<bool, 3> output_mask = {true, true, true};\n    return acl_op::native_layer_norm_backward(d_y, X, normalized_shape, mean, variance, gamma, beta, output_mask);\n}\n} // namespace acl_op\n"
- filename: AtanKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nat::Tensor& atan_out_npu_nocheck(at::Tensor& result, const at::Tensor& self) {\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"Atan\")\n      .Input(self)\n      .Output(result)\n      .Run();\n  return result;\n}\n} // namespace\n\nat::Tensor& atan_out(const at::Tensor& self, at::Tensor& result) {\n  npu_preparation::CheckOut(\n      {self},\n      result,\n      self);\n  if (!npu_utils::check_match(&result)) {\n    at::Tensor contiguous_result = npu_utils::format_contiguous(result);\n    atan_out_npu_nocheck(contiguous_result, self);\n    npu_utils::format_fresh_view(result, contiguous_result);\n  } else {\n    atan_out_npu_nocheck(result, self);\n  }\n  return result;\n}\n\nat::Tensor atan(const at::Tensor& self) {\n  at::Tensor result = npu_preparation::apply_tensor(self);\n  atan_out_npu_nocheck(result, self);\n  return result;\n}\n\nat::Tensor& atan_(at::Tensor& self) {\n  return acl_op::atan_out(self, self);\n}\n} // namespace acl_op\n"
- filename: CastKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"torch_npu/csrc/aten/CustomFunctions.h\"\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\nusing calcu_op_util = at_npu::native::CalcuOpUtil;\n\nnamespace {\nat::Tensor& cast_nocheck(at::Tensor& result, const at::Tensor& self) {\n  int64_t dst_data_type = calcu_op_util::ConvertToAclDataType(result.scalar_type());\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"Cast\")\n      .Input(self)\n      .Output(result)\n      .Attr(\"dst_type\", dst_data_type)\n      .Run();\n  return result;\n}\n\nat::Tensor npu_dtype_cast_impl(const at::Tensor& self, at::ScalarType dtype) {\n  if (self.dtype() == dtype) {\n    return self.clone();\n  }\n  at::Tensor result = npu_preparation::apply_tensor(self.sizes(), self.options().dtype(dtype), self);\n  cast_nocheck(result, self);\n  return result;\n}\n} // namespace\n\nat::Tensor& npu_dtype_cast_(at::Tensor& self, const at::Tensor& src) {\n  if (self.dtype() == src.dtype()) {\n    return self;\n  }\n\n  if (!npu_utils::check_match(&self)) {\n    at::Tensor contiguous_self = npu_preparation::apply_tensor(self);\n    cast_nocheck(contiguous_self, src);\n    npu_utils::format_fresh_view(self, contiguous_self);\n  } else {\n    cast_nocheck(self, src);\n  }\n  return self;\n}\n\nat::Tensor npu_dtype_cast(const at::Tensor& self, at::ScalarType dtype) {\n  return npu_dtype_cast_impl(self, dtype);\n}\n\nat::Tensor npu_dtype_cast_backward(const at::Tensor& grad, at::ScalarType dtype) {\n  grad.requires_grad_();\n  return at_npu::native::custom_ops::npu_dtype_cast(grad, dtype);\n}\n\n}  // namespace acl_op\n"
- filename: EmbeddingDenseBackwardKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nat::Tensor embedding_dense_backward(\n    const at::Tensor& grad_output,\n    const at::Tensor& indices,\n    int64_t num_weights,\n    int64_t padding_idx,\n    bool scale_grad_by_freq) {\n    TORCH_CHECK(grad_output.dim() >= 1, \"The dim of input 'grad_output' must be greater than or equal to 1.\"\n        + OPS_ERROR(ErrCode::PARAM));\n    auto output_size = {num_weights, grad_output.size(-1)};\n    at::Tensor result = npu_preparation::apply_tensor(grad_output, output_size);\n\n    // indices must be int64 in pytorch, but npu can only support int32\n    auto indices_int32 = at_npu::native::custom_ops::npu_dtype_cast(indices, at::kInt);\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"EmbeddingDenseGrad\")\n        .Input(grad_output)\n        .Input(indices_int32)\n        .Attr(\"num_weights\", num_weights)\n        .Attr(\"padding_idx\", padding_idx)\n        .Attr(\"scale_grad_by_freq\", scale_grad_by_freq)\n        .Output(result)\n        .Run();\n    return result;\n}\n} // namespace acl_op\n"
- filename: TriuKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nat::Tensor& triu_out_npu_nocheck(at::Tensor& result, const at::Tensor& self, int64_t k) {\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"Triu\")\n      .Input(self)\n      .Output(result)\n      .Attr(\"diagonal\", k)\n      .Run();\n  return result;\n}\n} // namespace\n\nat::Tensor& triu_out(const at::Tensor& self, int64_t k, at::Tensor& result) {\n  npu_preparation::CheckOut(\n      {self},\n      result,\n      self);\n  if (!npu_utils::check_match(&result)) {\n    at::Tensor contiguous_result = npu_utils::format_contiguous(result);\n    triu_out_npu_nocheck(contiguous_result, self, k);\n    npu_utils::format_fresh_view(result, contiguous_result);\n  } else {\n    triu_out_npu_nocheck(result, self, k);\n  }\n  return result;\n}\n\nat::Tensor triu(const at::Tensor& self, int64_t k) {\n  at::Tensor result = npu_preparation::apply_tensor(self);\n  triu_out_npu_nocheck(result, self, k);\n  return result;\n}\n\nat::Tensor& triu_(at::Tensor& self, int64_t k) {\n  return acl_op::triu_out(self, k, self);\n}\n} // namespace acl_op\n"
- filename: QuantizePerChannelKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n#ifdef VERSION_V1R11 || VERSION_V2R0 || VERSION_V2R1\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nnamespace {\nc10::SmallVector<int64_t, SIZE> quantize_reshape_size(\n    const at::Tensor& self,\n    int64_t axis)\n{\n    c10::SmallVector<int64_t, SIZE> out_size;\n    for (int64_t i = 0; i < self.dim(); i++) {\n        if (i != axis) {\n            out_size.emplace_back(1);\n        } else {\n            out_size.emplace_back(self.sizes()[i]);\n        }\n    }\n    return out_size;\n}\n\nat::Tensor& quantize_per_channel_out_nocheck(\n    at::Tensor& result,\n    const at::Tensor& self,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis,\n    at::ScalarType dtype)\n{\n    auto reshape_size = quantize_reshape_size(self, axis);\n    at::Tensor scales_reshape = scales.reshape(reshape_size);\n    at::Tensor zp_reshape = zero_points.reshape(reshape_size);\n    string dtype_str = \"torch.qint8\";\n    if (dtype == at::ScalarType::QUInt8) {\n        dtype_str = \"torch.quint8\";\n    } else if (dtype == at::ScalarType::QInt32) {\n        dtype_str = \"torch.qint32\";\n    }\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"Quantize\")\n       .Input(self)\n       .Input(scales_reshape)\n       .Input(zp_reshape)\n       .Output(result)\n       .Attr(\"axis\", axis)\n       .Attr(\"dtype\", dtype_str)\n       .Run();\n    return result;\n}\n} // namespace\n\nat::Tensor quantize_per_channel(\n    const at::Tensor& self,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis,\n    at::ScalarType dtype)\n{\n    axis = op_plugin::utils::make_warp_dim(axis, self.dim());\n    TORCH_CHECK(scales.dim() == 1, \"Scales' dim should be equal to 1.\");\n    TORCH_CHECK(zero_points.dim() == 1, \"Zero points' dim should be equal to 1.\");\n    TORCH_CHECK(scales.sizes()[0] == zero_points.sizes()[0], \"Scales' size should be equal to zero points' size.\");\n    TORCH_CHECK(axis <= self.sizes().size() - 1, \"Unexpected value of axis.\");\n    TORCH_CHECK(scales.sizes()[0] == self.sizes()[axis], \"length of scales must equal to the specified dimension.\");\n    auto output_dtype = at::kInt;\n    if (dtype == at::ScalarType::QInt8) {\n        output_dtype = at::kChar;\n    } else if (dtype == at::ScalarType::QUInt8) {\n        output_dtype = at::kByte;\n    } else if (dtype == at::ScalarType::QInt32) {\n        output_dtype = at::kInt;\n    }\n    at::Tensor result = npu_preparation::apply_tensor(self, self.options().dtype(output_dtype));\n    quantize_per_channel_out_nocheck(result, self, scales, zero_points, axis, dtype);\n    return result;\n}\n} // namespace acl_op\n#endif\n\n\n#ifdef VERSION_V2R2\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n#include <ATen/ops/quantize_per_channel.h>\n#include <ATen/native/quantized/AffineQuantizer.h>\n#include <vector>\n\n#include <torch/library.h>\n\nnamespace acl_op {\nnamespace {\nc10::SmallVector<int64_t, SIZE> quantize_reshape_size(\n    const at::Tensor& self,\n    int64_t axis)\n{\n    c10::SmallVector<int64_t, SIZE> out_size;\n    for (int64_t i = 0; i < self.dim(); i++) {\n        if (i != axis) {\n            out_size.emplace_back(1);\n        } else {\n            out_size.emplace_back(self.sizes()[i]);\n        }\n    }\n    return out_size;\n}\n\nat::Tensor& quantize_per_channel_out_nocheck(\n    at::Tensor& result,\n    const at::Tensor& self,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis,\n    at::ScalarType dtype)\n{\n    auto reshape_size = quantize_reshape_size(self, axis);\n    at::Tensor scales_reshape = scales.reshape(reshape_size);\n    at::Tensor zero_points_reshape = zero_points.reshape(reshape_size);\n    string dtype_str = \"torch.qint8\";\n    if (dtype == at::ScalarType::QUInt8) {\n        dtype_str = \"torch.quint8\";\n    } else if (dtype == at::ScalarType::QInt32) {\n        dtype_str = \"torch.qint32\";\n    }\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"Quantize\")\n       .Input(self)\n       .Input(scales_reshape)\n       .Input(zero_points_reshape)\n       .Output(result)\n       .Attr(\"axis\", axis)\n       .Attr(\"dtype\", dtype_str)\n       .Run();\n    return result;\n}\n} // namespace\n\nat::Tensor quantize_per_channel(\n    const at::Tensor& self,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis,\n    at::ScalarType dtype)\n{\n    auto zero_points_cpu = zero_points.to(at::Device(at::kCPU), at::kLong).contiguous();\n    return at::native::quantize_per_channel(self, scales, zero_points_cpu, axis, dtype);\n}\n} // namespace acl_op\n\nnamespace at {\nnamespace native {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nvoid quantize_tensor_per_channel_affine_npu(\n    const at::Tensor& rtensor,\n    at::Tensor& qtensor,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points_cpu,\n    int64_t axis)\n{\n    auto zero_points = zero_points_cpu.to(at::Device(at::kPrivateUse1), at::ScalarType::Int).contiguous();\n    at::ScalarType dtype = qtensor.options().dtype().toScalarType();\n    axis = op_plugin::utils::make_warp_dim(axis, rtensor.dim());\n    TORCH_CHECK(scales.dim() == 1, \"Scales' dim should be equal to 1.\");\n    TORCH_CHECK(zero_points.dim() == 1, \"Zero points' dim should be equal to 1.\");\n    TORCH_CHECK(scales.sizes()[0] == zero_points.sizes()[0], \"Scales' size should be equal to zero points' size.\");\n    TORCH_CHECK(axis <= rtensor.sizes().size() - 1, \"Unexpected value of axis.\");\n    TORCH_CHECK(scales.sizes()[0] == rtensor.sizes()[axis], \"length of scales must equal to the specified dimension.\");\n    auto output_dtype = at::kInt;\n    if (dtype == at::ScalarType::QInt8) {\n        output_dtype = at::kChar;\n    } else if (dtype == at::ScalarType::QUInt8) {\n        output_dtype = at::kByte;\n    } else if (dtype == at::ScalarType::QInt32) {\n        output_dtype = at::kInt;\n    }\n    at::Tensor result = npu_preparation::apply_tensor(rtensor, rtensor.options().dtype(output_dtype));\n    acl_op::quantize_per_channel_out_nocheck(result, rtensor, scales, zero_points, axis, dtype);\n    at_npu::native::NPUNativeFunctions::set_(qtensor, result);\n}\n\nvoid dequantize_tensor_per_channel_affine_npu(\n    const at::Tensor& qtensor,\n    at::Tensor& rtensor,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points_cpu,\n    int64_t axis)\n{\n    auto zero_points = zero_points_cpu.to(at::Device(at::kPrivateUse1), at::ScalarType::Int).contiguous();\n    axis = op_plugin::utils::make_warp_dim(axis, qtensor.dim());\n    TORCH_CHECK(scales.dim() == 1, \"Scales' dim should be equal to 1.\");\n    TORCH_CHECK(zero_points.dim() == 1, \"Zero points' dim should be equal to 1.\");\n    TORCH_CHECK(scales.sizes()[0] == zero_points.sizes()[0], \"Scales' size should be equal to zero points' size.\");\n    TORCH_CHECK(axis <= qtensor.sizes().size() - 1, \"Unexpected value of axis.\");\n    TORCH_CHECK(scales.sizes()[0] == qtensor.sizes()[axis], \"length of scales must equal to the specified dimension.\");\n\n    auto dtype = qtensor.scalar_type();\n    auto output_dtype = at::kInt;\n    if (dtype == at::ScalarType::QInt8) {\n        output_dtype = at::kChar;\n    } else if (dtype == at::ScalarType::QUInt8) {\n        output_dtype = at::kByte;\n    }\n    at::Tensor result = at::empty(\n        qtensor.sizes(),\n        qtensor.options().dtype(output_dtype).memory_format(qtensor.suggest_memory_format()));\n\n    at_npu::native::NPUNativeFunctions::set_(result, qtensor);\n    rtensor = at_npu::native::custom_ops::npu_dtype_cast(result, at::ScalarType::Float);\n\n    auto reshape_size = acl_op::quantize_reshape_size(qtensor, axis);\n    at::Tensor scales_reshape = scales.reshape(reshape_size);\n    at::Tensor zero_points_reshape = zero_points.reshape(reshape_size);\n    rtensor = (rtensor - zero_points_reshape) * scales_reshape;\n}\n\nREGISTER_PRIVATEUSE1_DISPATCH(quantize_tensor_per_channel_affine_stub, &quantize_tensor_per_channel_affine_npu);\nREGISTER_PRIVATEUSE1_DISPATCH(dequantize_tensor_per_channel_affine_stub, &dequantize_tensor_per_channel_affine_npu);\n\n} // namespace native\n} // namespace at\n#endif\n\n#ifdef VERSION_V2R3\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n#include <ATen/ops/quantize_per_channel.h>\n#include <ATen/native/quantized/AffineQuantizer.h>\n#include <vector>\n\n#include <torch/library.h>\n\nnamespace acl_op {\nnamespace {\nc10::SmallVector<int64_t, SIZE> quantize_reshape_size(\n    const at::Tensor& self,\n    int64_t axis)\n{\n    c10::SmallVector<int64_t, SIZE> out_size;\n    for (int64_t i = 0; i < self.dim(); i++) {\n        if (i != axis) {\n            out_size.emplace_back(1);\n        } else {\n            out_size.emplace_back(self.sizes()[i]);\n        }\n    }\n    return out_size;\n}\n\nat::Tensor& quantize_per_channel_out_nocheck(\n    at::Tensor& result,\n    const at::Tensor& self,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis,\n    at::ScalarType dtype)\n{\n    auto reshape_size = quantize_reshape_size(self, axis);\n    at::Tensor scales_reshape = scales.reshape(reshape_size);\n    at::Tensor zero_points_reshape = zero_points.reshape(reshape_size);\n    string dtype_str = \"torch.qint8\";\n    if (dtype == at::ScalarType::QUInt8) {\n        dtype_str = \"torch.quint8\";\n    } else if (dtype == at::ScalarType::QInt32) {\n        dtype_str = \"torch.qint32\";\n    }\n    at_npu::native::OpCommand cmd;\n    cmd.Name(\"Quantize\")\n       .Input(self)\n       .Input(scales_reshape)\n       .Input(zero_points_reshape)\n       .Output(result)\n       .Attr(\"axis\", axis)\n       .Attr(\"dtype\", dtype_str)\n       .Run();\n    return result;\n}\n} // namespace\n\nat::Tensor quantize_per_channel(\n    const at::Tensor& self,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis,\n    at::ScalarType dtype)\n{\n    return at::native::quantize_per_channel(self, scales, zero_points, axis, dtype);\n}\n} // namespace acl_op\n\nnamespace at {\nnamespace native {\nusing npu_preparation = at_npu::native::OpPreparation;\n\nvoid quantize_tensor_per_channel_affine_npu(\n    const at::Tensor& rtensor,\n    at::Tensor& qtensor,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis)\n{\n    at::ScalarType dtype = qtensor.options().dtype().toScalarType();\n    axis = op_plugin::utils::make_warp_dim(axis, rtensor.dim());\n    TORCH_CHECK(scales.dim() == 1, \"Scales' dim should be equal to 1.\");\n    TORCH_CHECK(zero_points.dim() == 1, \"Zero points' dim should be equal to 1.\");\n    TORCH_CHECK(scales.sizes()[0] == zero_points.sizes()[0], \"Scales' size should be equal to zero points' size.\");\n    TORCH_CHECK(axis <= rtensor.sizes().size() - 1, \"Unexpected value of axis.\");\n    TORCH_CHECK(scales.sizes()[0] == rtensor.sizes()[axis], \"length of scales must equal to the specified dimension.\");\n    auto output_dtype = at::kInt;\n    if (dtype == at::ScalarType::QInt8) {\n        output_dtype = at::kChar;\n    } else if (dtype == at::ScalarType::QUInt8) {\n        output_dtype = at::kByte;\n    } else if (dtype == at::ScalarType::QInt32) {\n        output_dtype = at::kInt;\n    }\n    at::Tensor result = npu_preparation::apply_tensor(rtensor, rtensor.options().dtype(output_dtype));\n    at::Tensor zero_points_cp = zero_points.to(at::ScalarType::Int).contiguous();\n    acl_op::quantize_per_channel_out_nocheck(result, rtensor, scales, zero_points_cp, axis, dtype);\n    at_npu::native::NPUNativeFunctions::set_(qtensor, result);\n}\n\nvoid dequantize_tensor_per_channel_affine_npu(\n    const at::Tensor& qtensor,\n    at::Tensor& rtensor,\n    const at::Tensor& scales,\n    const at::Tensor& zero_points,\n    int64_t axis)\n{\n    axis = op_plugin::utils::make_warp_dim(axis, qtensor.dim());\n    TORCH_CHECK(scales.dim() == 1, \"Scales' dim should be equal to 1.\");\n    TORCH_CHECK(zero_points.dim() == 1, \"Zero points' dim should be equal to 1.\");\n    TORCH_CHECK(scales.sizes()[0] == zero_points.sizes()[0], \"Scales' size should be equal to zero points' size.\");\n    TORCH_CHECK(axis <= qtensor.sizes().size() - 1, \"Unexpected value of axis.\");\n    TORCH_CHECK(scales.sizes()[0] == qtensor.sizes()[axis], \"length of scales must equal to the specified dimension.\");\n\n    auto dtype = qtensor.scalar_type();\n    auto output_dtype = at::kInt;\n    if (dtype == at::ScalarType::QInt8) {\n        output_dtype = at::kChar;\n    } else if (dtype == at::ScalarType::QUInt8) {\n        output_dtype = at::kByte;\n    }\n    at::Tensor result = at::empty(\n        qtensor.sizes(),\n        qtensor.options().dtype(output_dtype).memory_format(qtensor.suggest_memory_format()));\n\n    at_npu::native::NPUNativeFunctions::set_(result, qtensor);\n    rtensor = at_npu::native::custom_ops::npu_dtype_cast(result, at::ScalarType::Float);\n\n    auto reshape_size = acl_op::quantize_reshape_size(qtensor, axis);\n    at::Tensor scales_reshape = scales.reshape(reshape_size);\n    at::Tensor zero_points_cp = zero_points.to(at::ScalarType::Int).contiguous();\n    at::Tensor zero_points_reshape = zero_points_cp.reshape(reshape_size);\n    rtensor = (rtensor - zero_points_reshape) * scales_reshape;\n}\n\nREGISTER_PRIVATEUSE1_DISPATCH(quantize_tensor_per_channel_affine_stub, &quantize_tensor_per_channel_affine_npu);\nREGISTER_PRIVATEUSE1_DISPATCH(dequantize_tensor_per_channel_affine_stub, &dequantize_tensor_per_channel_affine_npu);\n\n} // namespace native\n} // namespace at\n#endif"
- filename: GcdKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// Copyright (c) 2019, Facebook CORPORATION.\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nat::Tensor& gcd_out(const at::Tensor &self, const at::Tensor &other, at::Tensor &out) {\n  // convert args to cpu in order to use at::native kernel\n  TORCH_NPU_WARN_ONCE(\"Warning: kernel [gcd.out] is not supported by NPU currently. Now this kernel is running on CPU.\");\n  const auto self_cpu = self.cpu();\n  const auto other_cpu = other.cpu();\n  auto out_cpu = out.cpu();\n  out_cpu = at::gcd_out(out_cpu, self_cpu, other_cpu);\n  out.copy_(out_cpu);\n  return out;\n}\n}  // acl_op\n"
- filename: SoftMarginLossKernelNpu.cpp
  data: "// Copyright (c) 2023 Huawei Technologies Co., Ltd\n// All rights reserved.\n//\n// Licensed under the BSD 3-Clause License  (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n// https://opensource.org/licenses/BSD-3-Clause\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\n#include \"op_plugin/AclOpsInterface.h\"\n#include \"op_plugin/utils/OpAdapter.h\"\n\nnamespace acl_op {\nusing npu_preparation = at_npu::native::OpPreparation;\nusing npu_utils = at_npu::native::NpuUtils;\n\nnamespace {\nat::Tensor& soft_margin_loss_out_nocheck(\n    at::Tensor& result,\n    const at::Tensor& self,\n    const at::Tensor& target,\n    int64_t reduction) {\n  at::Tensor target_broadcast = target;\n  if (target.sizes() != self.sizes()) {\n    target_broadcast = acl_op::npu_broadcast(target, self.sizes());\n  }\n  string reduction_str(op_plugin::utils::get_reduction_str(reduction));\n  at_npu::native::OpCommand cmd;\n  cmd.Name(\"SoftMarginLoss\")\n      .Input(self)\n      .Input(target_broadcast)\n      .Output(result)\n      .Attr(\"reduction\", reduction_str)\n      .Run();\n  return result;\n}\n} // namespace\n\nat::Tensor& soft_margin_loss_out(\n    const at::Tensor& self,\n    const at::Tensor& target,\n    int64_t reduction,\n    at::Tensor& result) {\n  auto output_size = op_infer::soft_margin_loss_npu_output_size(self, target, reduction);\n  npu_preparation::CheckOut(\n      {self, target},\n      result,\n      self,\n      output_size);\n\n  if (!npu_utils::check_match(&result)) {\n    at::Tensor contiguous_result = npu_utils::format_contiguous(result);\n    soft_margin_loss_out_nocheck(contiguous_result, self, target, reduction);\n    npu_utils::format_fresh_view(result, contiguous_result);\n  } else {\n    soft_margin_loss_out_nocheck(result, self, target, reduction);\n  }\n  return result;\n}\n\nat::Tensor soft_margin_loss(const at::Tensor& self, const at::Tensor& target, int64_t reduction) {\n  auto output_size = op_infer::soft_margin_loss_npu_output_size(self, target, reduction);\n  at::Tensor result = npu_preparation::apply_tensor(self, output_size);\n\n  soft_margin_loss_out_nocheck(result, self, target, reduction);\n\n  if (reduction == at::Reduction::None) {\n    return result;\n  } else {\n    return result.reshape({});\n  }\n}\n} // namespace acl_op\n"