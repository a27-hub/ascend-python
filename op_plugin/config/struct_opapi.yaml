- func: abs.out(Tensor self, *, Tensor(a!) out) -> Tensor(a!)
  version: base
  out:
    size: self
    dtype: self
    name: self
  exec: aclnnAbs, self, out

- func: abs(Tensor self) -> Tensor
  structured_delegate: abs.out

- func: abs_(Tensor(a!) self) -> Tensor(a!)
  structured_delegate: abs.out

- func: acosh.out(Tensor self, *, Tensor(a!) out) -> Tensor(a!)
  version: base
  out:
    size: self
    dtype: out
  exec: aclnnAcosh

- func: acosh_(Tensor(a!) self) -> Tensor(a!)
  version: base
  exec: aclnnInplaceAcosh


- func: ceil.out(Tensor self, *, Tensor(a!) out) -> Tensor(a!)
  version: base
  out:
    size: self
    dtype: self
  exec: aclnnCeil

- func: ceil(Tensor self) -> Tensor
  structured_delegate: ceil.out

- func: ceil_(Tensor(a!) self) -> Tensor(a!)
  version: base
  exec: aclnnInplaceCeil

- func: batch_norm_stats(Tensor input, float eps) -> (Tensor, Tensor)
  version: base
  result0:
    size: '{input.size(1)}'
    dtype: at::kFloat
  result1:
    size: '{input.size(1)}'
    dtype: at::kFloat
  exec: aclnnBatchNormStats

- func: adaptive_max_pool2d.out(Tensor self, int[2] output_size, *, Tensor(a!) out, Tensor(b!) indices) -> (Tensor(a!), Tensor(b!))
  version: base
  out:
    size: op_infer::max_pool2d_out_size(self, output_size)
    dtype: self
  indices:
    size: op_infer::max_pool2d_out_size(self, output_size)
    dtype: at::ScalarType::Long
  exec: aclnnAdaptiveMaxPool2d

- func: adaptive_max_pool2d(Tensor self, int[2] output_size) -> (Tensor, Tensor)
  structured_delegate: adaptive_max_pool2d.out

- func: _adaptive_avg_pool2d_backward(Tensor grad_output, Tensor self) -> Tensor
  version: base
  out:
    size: self
    dtype: self
  exec: aclnnAdaptiveAvgPool2dBackward

- func: _adaptive_avg_pool3d_backward(Tensor grad_output, Tensor self) -> Tensor
  version: base
  out:
    size: self
    dtype: self
  exec: aclnnAdaptiveAvgPool3dBackward

- func: adaptive_avg_pool3d_backward.grad_input(Tensor grad_output, Tensor self, *, Tensor(a!) grad_input) -> Tensor(a!)
  version: base
  exec: aclnnAdaptiveAvgPool3dBackward

- func: addr(Tensor self, Tensor vec1, Tensor vec2, *, Scalar beta=1, Scalar alpha=1) -> Tensor
  version: base
  result:
    size: op_infer::addr_npu_output_size(self, vec1, vec2, beta, alpha)
    dtype: at::native::result_type({self, vec1, vec2})
  exec: aclnnAddr

- func: addr.out(Tensor self, Tensor vec1, Tensor vec2, *, Scalar beta=1, Scalar alpha=1, Tensor(a!) out) -> Tensor(a!)
  version: base
  out:
    size: out
    dtype: out
  exec: aclnnAddr

- func: addr_(Tensor(a!) self, Tensor vec1, Tensor vec2, *, Scalar beta=1, Scalar alpha=1) -> Tensor(a!)
  version: base
  exec: aclnnInplaceAddr

- func: npu_add_rms_norm(Tensor x1, Tensor x2, Tensor gamma, float epsilon=1e-06) -> (Tensor, Tensor, Tensor)
  version: base
  result0:
    size: op_infer::rms_norm_npu_output_size(x1, gamma)[0]
    dtype: x1
  result1:
    size: op_infer::rms_norm_npu_output_size(x1, gamma)[1]
    dtype: at::kFloat
  result2:
    size: op_infer::rms_norm_npu_output_size(x1, gamma)[0]
    dtype: x1
  exec: aclnnAddRmsNorm

- func: amax(Tensor self, int[1] dim=[], bool keepdim=False) -> Tensor
  version: base
  structured_delegate: amax.out

- func: amax.out(Tensor self, int[1] dim=[], bool keepdim=False, *, Tensor(a!) out) -> Tensor(a!)
  version: base
  out:
    size: op_infer::reduce_ops_npu_output_size(self, dim, keepdim)
    dtype: self
  exec: aclnnAmax

- func: amin(Tensor self, int[1] dim=[], bool keepdim=False) -> Tensor
  version: base
  structured_delegate: amin.out

- func: amin.out(Tensor self, int[1] dim=[], bool keepdim=False, *, Tensor(a!) out) -> Tensor(a!)
  version: base
  out:
    size: op_infer::reduce_ops_npu_output_size(self, dim, keepdim)
    dtype: self
  exec: aclnnAmin

- func: _aminmax(Tensor self) -> (Tensor, Tensor)
  version: base
  result0:
    size: op_infer::reduce_ops_npu_output_size(self, self.sizes(), false)
    dtype: self
  result1:
    size: op_infer::reduce_ops_npu_output_size(self, self.sizes(), false)
    dtype: self
  exec: aclnnAminmaxAll

- func: _aminmax.dim(Tensor self, int dim, bool keepdim=False) -> (Tensor, Tensor)
  version: base
  result0:
    size: op_infer::reduce_ops_npu_output_size(self, {dim}, keepdim)
    dtype: self
  result1:
    size: op_infer::reduce_ops_npu_output_size(self, {dim}, keepdim)
    dtype: self
  exec: aclnnAminmaxDim
