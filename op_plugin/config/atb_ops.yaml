# This file describes the mapping from ATB public C++ interfaces to the
# existing ::atb implementation functions.
#
# It is consumed by torchnpugen/gen_atb_ops.py to generate:
#   - op_plugin/include/AtbOpsInterface.h
#   - op_plugin/ops/atb/AtbOpsInterface.cpp
#
# Field meanings:
#   - cpp_name:
#       The public C++ function name generated under namespace
#       at_npu::native::atb.
#   - impl_name:
#       The existing ::atb implementation function that the generated wrapper
#       forwards to.
#
# Maintenance rules:
#   - This file is an interface-to-implementation mapping file, not a schema
#     source of truth file.
#   - ATB dispatcher schemas are discovered from op_plugin/ops/atb/*.cpp
#     TORCH_LIBRARY_FRAGMENT(atb, m) / m.def(...) definitions.
#   - Public C++ wrapper signatures are derived from the corresponding
#     ::atb implementation function definitions.

